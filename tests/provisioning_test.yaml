suite: Identity provisioning before workloads
templates:
- templates/*.yaml
release:
  name: poc
set:
  namespace: identity-stage
  platform.azure.identities:
    backend:
      azureName: id-example-backend
  platform.azure.location: example-region
  platform.azure.subscriptionId: example-subscription
  platform.azure.identityResourceGroup: example-platform
  platform.azure.oidcIssuerUrl: https://issuer.example.invalid/
tests:

- it: provisions identities without an annotated account until client ID exists
  asserts:
  - hasDocuments: {count: 1}
    template: user-assigned-identity.yaml
  - hasDocuments: {count: 1}
    template: federated-identity-credential.yaml
  - hasDocuments: {count: 0}
    template: service-account.yaml

- it: rejects workloads before client ID delivery
  values:
  - ../examples/application.yaml
  set:
    components.backend.identity: backend
  asserts:
  - failedTemplate:
      errorPattern: needs clientId before deploying workloads
    template: rollout.yaml
