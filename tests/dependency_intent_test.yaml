suite: Minimal worker storage and model dependencies
tests:
- it: keeps workers as ordinary Deployments without Services or HTTP probes
  template: templates/deployment.yaml
  asserts:
  - equal:
      path: spec.template.spec.containers[0].command
      value:
      - python
      - worker.py
  - notExists:
      path: spec.template.spec.containers[0].ports
  - notExists:
      path: spec.template.spec.containers[0].readinessProbe
  - equal:
      path: spec.template.spec.serviceAccountName
      value: worker-runtime
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: MODEL_DEPLOYMENT
        value: chat
  values:
  - fixtures/dependencies.yaml
- it: omits the worker Service
  template: templates/service.yaml
  asserts:
  - hasDocuments:
      count: 0
  values:
  - fixtures/dependencies.yaml
- it: keeps the container private with a stable generated name
  template: templates/storage-container.yaml
  asserts:
  - matchRegex:
      path: spec.azureName
      pattern: ^second-pr-42-.*-[a-f0-9]{12}$
  - equal:
      path: spec.publicAccess
      value: None
  - equal:
      path: metadata.annotations['argocd.argoproj.io/sync-wave']
      value: '-29'
  values:
  - fixtures/dependencies.yaml
- it: preserves the separate model scope and inference-only role
  template: templates/identity.yaml
  documentSelector:
    path: spec.roleDefinitionReference.wellKnownName
    value: Cognitive Services OpenAI User
  asserts:
  - equal:
      path: spec.owner.armId
      value: /subscriptions/00000000-0000-0000-0000-000000000001/resourceGroups/example-rg/providers/Microsoft.CognitiveServices/accounts/example-foundry
  - notExists:
      path: spec.condition
  values:
  - fixtures/dependencies.yaml
- it: scopes Blob permissions by container without a broad built-in role
  template: templates/identity.yaml
  documentSelector:
    path: spec.conditionVersion
    value: '2.0'
  asserts:
  - equal:
      path: spec.owner.armId
      value: /subscriptions/00000000-0000-0000-0000-000000000001/resourceGroups/example-rg/providers/Microsoft.Storage/storageAccounts/examplestorage
  - matchRegex:
      path: spec.condition
      pattern: containers:name.*StringEquals 'second-pr-42-.*[a-f0-9]{12}'
  - notExists:
      path: spec.roleDefinitionReference.wellKnownName
  values:
  - fixtures/dependencies.yaml
