suite: HTTPRoute

templates:
  - templates/http-route.yaml

release:
  name: poc

tests:

  - it: renders preview HTTPRoute resources
    values:
      - ../examples/application.yaml
      - ../examples/preview.yaml

    asserts:
      - hasDocuments:
          count: 3

      - equal:
          path: metadata.namespace
          value: preview-pr-42

      - equal:
          path: spec.rules[0].backendRefs
          value:
            - name: backend-stable
              port: 8000
              weight: 100
            - name: backend-canary
              port: 8000
              weight: 0
        documentSelector:
          path: metadata.name
          value: backend

      - equal:
          path: spec.rules[0].matches[0].path.value
          value: /
        documentSelector:
          path: metadata.name
          value: frontend

      - equal:
          path: spec.rules[0].backendRefs[0].name
          value: frontend
        documentSelector:
          path: metadata.name
          value: frontend

      - equal:
          path: spec.hostnames
          value:
            - pr-42.preview.example.com

      - equal:
          path: spec.parentRefs[0].sectionName
          value: http
        documentSelector:
          path: metadata.name
          value: public-redirect

      - equal:
          path: spec.rules[0].filters[0].requestRedirect
          value:
            scheme: https
            statusCode: 301
        documentSelector:
          path: metadata.name
          value: public-redirect

  - it: renders staging HTTPRoute resources
    values:
      - ../examples/application.yaml
      - ../examples/staging.yaml

    asserts:
      - hasDocuments:
          count: 3

      - equal:
          path: metadata.namespace
          value: poc-staging

      - equal:
          path: spec.rules[0].backendRefs
          value:
            - name: backend-stable
              port: 8000
              weight: 100
            - name: backend-canary
              port: 8000
              weight: 0
        documentSelector:
          path: metadata.name
          value: backend

  - it: renders production HTTPRoute resources
    values:
      - ../examples/application.yaml
      - ../examples/production.yaml

    asserts:
      - hasDocuments:
          count: 3

      - equal:
          path: metadata.namespace
          value: poc-production

      - equal:
          path: spec.rules[0].backendRefs
          value:
            - name: backend-stable
              port: 8000
              weight: 100
            - name: backend-canary
              port: 8000
              weight: 0
        documentSelector:
          path: metadata.name
          value: backend

  - it: scales component and host maps with merged resource defaults
    values:
      - ../examples/application.yaml
      - ../examples/preview.yaml
      - fixtures/extra.yaml

    asserts:
      - hasDocuments:
          count: 5

      - equal:
          path: spec.hostnames
          value:
            - internal.preview.example.com
        documentSelector:
          path: metadata.name
          value: processor

      - equal:
          path: spec.parentRefs[0].name
          value: internal
        documentSelector:
          path: metadata.name
          value: processor

  - it: renders another application without the example components
    values:
      - fixtures/extra.yaml
    set:
      namespace: another-app

    asserts:
      - hasDocuments:
          count: 2

  - it: can disable redirects
    values:
      - ../examples/application.yaml
      - ../examples/preview.yaml
      - fixtures/extra.yaml
    set:
      platform.gateway.httpRedirect.enabled: false
      platform.pod.imagePullPolicy: Always

    asserts:
      - hasDocuments:
          count: 3

  - it: omits sync waves unless configured
    values:
      - ../examples/application.yaml
      - ../examples/preview.yaml

    asserts:
      - notExists:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]

  - it: applies sync waves to every resource of each kind
    values:
      - ../examples/application.yaml
      - ../examples/preview.yaml
    set:
      platform.syncWaves:
        httpRoute: 2

    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: '2'

  - it: renders nothing with empty values

    asserts:
      - hasDocuments:
          count: 0
