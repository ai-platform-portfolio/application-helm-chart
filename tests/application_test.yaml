suite: Application workloads and routing
templates:
- templates/*.yaml
release:
  name: poc
tests:

- it: renders preview workloads and exact-host routing
  values:
  - ../examples/application.yaml
  - ../examples/preview.yaml
  asserts:
  - hasDocuments: {count: 1}
    template: namespace.yaml
  - hasDocuments: {count: 1}
    template: deployment.yaml
  - hasDocuments: {count: 1}
    template: rollout.yaml
  - hasDocuments: {count: 3}
    template: service.yaml
  - hasDocuments: {count: 1}
    template: listener-set.yaml
  - hasDocuments: {count: 3}
    template: http-route.yaml
  - equal: {path: metadata.namespace, value: preview-pr-42}
    template: deployment.yaml
  - equal: {path: metadata.namespace, value: preview-pr-42}
    template: rollout.yaml
  - equal: {path: metadata.namespace, value: preview-pr-42}
    template: service.yaml
  - equal: {path: metadata.namespace, value: preview-pr-42}
    template: listener-set.yaml
  - equal: {path: metadata.namespace, value: preview-pr-42}
    template: http-route.yaml
  - equal: {path: metadata.name, value: preview-pr-42}
    template: namespace.yaml
  - equal: {path: 'spec.listeners[0].hostname', value: pr-42.preview.example.com}
    template: listener-set.yaml
  - equal: {path: 'metadata.annotations["cert-manager.io/cluster-issuer"]', value: letsencrypt-azuredns}
    template: listener-set.yaml
  - equal: {path: 'spec.rules[0].backendRefs', value: [{name: backend-stable, port: 8000, weight: 100}, {name: backend-canary,
          port: 8000, weight: 0}]}
    template: http-route.yaml
    documentSelector: {path: metadata.name, value: backend}
  - equal: {path: 'spec.rules[0].matches[0].path.value', value: /}
    template: http-route.yaml
    documentSelector: {path: metadata.name, value: frontend}
  - equal: {path: 'spec.rules[0].backendRefs[0].name', value: frontend}
    template: http-route.yaml
    documentSelector: {path: metadata.name, value: frontend}
  - equal: {path: spec.hostnames, value: [pr-42.preview.example.com]}
    template: http-route.yaml
  - equal: {path: 'spec.parentRefs[0].sectionName', value: http}
    template: http-route.yaml
    documentSelector: {path: metadata.name, value: public-redirect}
  - equal: {path: 'spec.rules[0].filters[0].requestRedirect', value: {scheme: https, statusCode: 301}}
    template: http-route.yaml
    documentSelector: {path: metadata.name, value: public-redirect}
  - equal: {path: 'spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem', value: true}
    template: deployment.yaml
  - equal: {path: spec.selector, value: {app.kubernetes.io/instance: poc, app.kubernetes.io/component: frontend}}
    template: service.yaml
    documentSelector: {path: metadata.name, value: frontend}
  - equal: {path: 'spec.template.metadata.labels["app.kubernetes.io/component"]', value: frontend}
    template: deployment.yaml
  - equal: {path: spec.strategy.canary.stableService, value: backend-stable}
    template: rollout.yaml
  - equal: {path: 'spec.strategy.canary.trafficRouting.plugins["argoproj-labs/gatewayAPI"].httpRoute', value: backend}
    template: rollout.yaml

- it: renders staging workloads and exact-host routing
  values:
  - ../examples/application.yaml
  - ../examples/staging.yaml
  asserts:
  - hasDocuments: {count: 1}
    template: namespace.yaml
  - hasDocuments: {count: 1}
    template: deployment.yaml
  - hasDocuments: {count: 1}
    template: rollout.yaml
  - hasDocuments: {count: 3}
    template: service.yaml
  - hasDocuments: {count: 1}
    template: listener-set.yaml
  - hasDocuments: {count: 3}
    template: http-route.yaml
  - equal: {path: metadata.namespace, value: poc-staging}
    template: deployment.yaml
  - equal: {path: metadata.namespace, value: poc-staging}
    template: rollout.yaml
  - equal: {path: metadata.namespace, value: poc-staging}
    template: service.yaml
  - equal: {path: metadata.namespace, value: poc-staging}
    template: listener-set.yaml
  - equal: {path: metadata.namespace, value: poc-staging}
    template: http-route.yaml
  - equal: {path: metadata.name, value: poc-staging}
    template: namespace.yaml
  - equal: {path: 'spec.listeners[0].hostname', value: poc.staging.example.com}
    template: listener-set.yaml
  - equal: {path: 'metadata.annotations["cert-manager.io/cluster-issuer"]', value: letsencrypt-azuredns}
    template: listener-set.yaml
  - equal: {path: 'spec.rules[0].backendRefs', value: [{name: backend-stable, port: 8000, weight: 100}, {name: backend-canary,
          port: 8000, weight: 0}]}
    template: http-route.yaml
    documentSelector: {path: metadata.name, value: backend}

- it: renders production workloads and exact-host routing
  values:
  - ../examples/application.yaml
  - ../examples/production.yaml
  asserts:
  - hasDocuments: {count: 1}
    template: namespace.yaml
  - hasDocuments: {count: 1}
    template: deployment.yaml
  - hasDocuments: {count: 1}
    template: rollout.yaml
  - hasDocuments: {count: 3}
    template: service.yaml
  - hasDocuments: {count: 1}
    template: listener-set.yaml
  - hasDocuments: {count: 3}
    template: http-route.yaml
  - equal: {path: metadata.namespace, value: poc-production}
    template: deployment.yaml
  - equal: {path: metadata.namespace, value: poc-production}
    template: rollout.yaml
  - equal: {path: metadata.namespace, value: poc-production}
    template: service.yaml
  - equal: {path: metadata.namespace, value: poc-production}
    template: listener-set.yaml
  - equal: {path: metadata.namespace, value: poc-production}
    template: http-route.yaml
  - equal: {path: metadata.name, value: poc-production}
    template: namespace.yaml
  - equal: {path: 'spec.listeners[0].hostname', value: poc.example.com}
    template: listener-set.yaml
  - equal: {path: 'metadata.annotations["cert-manager.io/cluster-issuer"]', value: letsencrypt-azuredns}
    template: listener-set.yaml
  - equal: {path: 'spec.rules[0].backendRefs', value: [{name: backend-stable, port: 8000, weight: 100}, {name: backend-canary,
          port: 8000, weight: 0}]}
    template: http-route.yaml
    documentSelector: {path: metadata.name, value: backend}

- it: scales component and host maps with merged resource defaults
  values:
  - ../examples/application.yaml
  - ../examples/preview.yaml
  - fixtures/extra.yaml
  asserts:
  - hasDocuments: {count: 2}
    template: deployment.yaml
  - hasDocuments: {count: 2}
    template: rollout.yaml
  - hasDocuments: {count: 6}
    template: service.yaml
  - hasDocuments: {count: 2}
    template: listener-set.yaml
  - hasDocuments: {count: 5}
    template: http-route.yaml
  - equal: {path: spec.replicas, value: 2}
    template: deployment.yaml
    documentSelector: {path: metadata.name, value: worker}
  - equal: {path: 'spec.template.spec.containers[0].resources.requests', value: {cpu: 250m, memory: 128Mi}}
    template: deployment.yaml
    documentSelector: {path: metadata.name, value: worker}
  - equal: {path: spec.hostnames, value: [internal.preview.example.com]}
    template: http-route.yaml
    documentSelector: {path: metadata.name, value: processor}
  - equal: {path: 'spec.parentRefs[0].name', value: internal}
    template: http-route.yaml
    documentSelector: {path: metadata.name, value: processor}

- it: renders another application without the example components
  values:
  - fixtures/extra.yaml
  set:
    namespace: another-app
  asserts:
  - hasDocuments: {count: 1}
    template: deployment.yaml
  - hasDocuments: {count: 1}
    template: rollout.yaml
  - hasDocuments: {count: 3}
    template: service.yaml
  - hasDocuments: {count: 2}
    template: http-route.yaml
  - equal: {path: metadata.namespace, value: another-app}
    template: service.yaml

- it: can disable redirects and override image pull policy
  values:
  - ../examples/application.yaml
  - ../examples/preview.yaml
  - fixtures/extra.yaml
  set:
    platform.gateway.httpRedirect.enabled: false
    platform.pod.imagePullPolicy: Always
  asserts:
  - hasDocuments: {count: 3}
    template: http-route.yaml
  - equal: {path: 'spec.template.spec.containers[0].imagePullPolicy', value: Always}
    template: deployment.yaml

- it: renders sidecars and init containers with platform defaults
  values:
  - ../examples/application.yaml
  - ../examples/preview.yaml
  - fixtures/containers.yaml
  asserts:
  - lengthEqual: {path: spec.template.spec.containers, count: 2}
    template: deployment.yaml
  - lengthEqual: {path: spec.template.spec.initContainers, count: 1}
    template: deployment.yaml
  - equal: {path: 'spec.template.spec.containers[1].securityContext.readOnlyRootFilesystem', value: true}
    template: deployment.yaml
  - equal: {path: 'spec.template.spec.initContainers[0].securityContext.readOnlyRootFilesystem', value: true}
    template: deployment.yaml
  - lengthEqual: {path: spec.template.spec.containers, count: 2}
    template: rollout.yaml
  - lengthEqual: {path: spec.template.spec.initContainers, count: 1}
    template: rollout.yaml
  - equal: {path: 'spec.template.spec.containers[1].securityContext.readOnlyRootFilesystem', value: true}
    template: rollout.yaml
  - equal: {path: 'spec.template.spec.initContainers[0].securityContext.readOnlyRootFilesystem', value: true}
    template: rollout.yaml
  - equal: {path: 'spec.template.spec.containers[1].name', value: telemetry}
    template: deployment.yaml
  - equal: {path: 'spec.template.spec.containers[1].ports[0].containerPort', value: 9090}
    template: deployment.yaml
  - equal: {path: 'spec.template.spec.containers[1].resources.requests', value: {cpu: 25m, memory: 128Mi}}
    template: deployment.yaml
  - equal: {path: 'spec.template.spec.initContainers[0].name', value: prepare}
    template: deployment.yaml

- it: omits sync waves unless configured
  values: &id001
  - ../examples/application.yaml
  - ../examples/preview.yaml
  asserts:
  - notExists: {path: 'metadata.annotations["argocd.argoproj.io/sync-wave"]'}
    template: namespace.yaml
  - notExists: {path: 'metadata.annotations["argocd.argoproj.io/sync-wave"]'}
    template: deployment.yaml
  - notExists: {path: 'metadata.annotations["argocd.argoproj.io/sync-wave"]'}
    template: rollout.yaml
  - notExists: {path: 'metadata.annotations["argocd.argoproj.io/sync-wave"]'}
    template: service.yaml
  - notExists: {path: 'metadata.annotations["argocd.argoproj.io/sync-wave"]'}
    template: listener-set.yaml
  - notExists: {path: 'metadata.annotations["argocd.argoproj.io/sync-wave"]'}
    template: http-route.yaml

- it: applies sync waves to every resource of each kind
  values: *id001
  set:
    platform.syncWaves:
      namespace: -20
      deployment: 0
      rollout: 1
      service: -10
      listenerSet: -5
      httpRoute: 2
  asserts:
  - equal: {path: 'metadata.annotations["argocd.argoproj.io/sync-wave"]', value: '-20'}
    template: namespace.yaml
  - equal: {path: 'metadata.annotations["argocd.argoproj.io/sync-wave"]', value: '0'}
    template: deployment.yaml
  - equal: {path: 'metadata.annotations["argocd.argoproj.io/sync-wave"]', value: '1'}
    template: rollout.yaml
  - equal: {path: 'metadata.annotations["argocd.argoproj.io/sync-wave"]', value: '-10'}
    template: service.yaml
  - equal: {path: 'metadata.annotations["argocd.argoproj.io/sync-wave"]', value: '-5'}
    template: listener-set.yaml
  - equal: {path: 'metadata.annotations["argocd.argoproj.io/sync-wave"]', value: '2'}
    template: http-route.yaml
