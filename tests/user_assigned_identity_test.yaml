suite: UserAssignedIdentity

templates:
  - templates/user-assigned-identity.yaml

release:
  name: poc

tests:

  - it: renders multiple UserAssignedIdentity resources with the expected Azure configuration
    values:
      - ../examples/application.yaml
      - ../examples/preview.yaml
      - fixtures/azure.yaml
    set:
      platform.azure.subscriptionId: example-subscription
      platform.azure.tenantId: example-tenant

    asserts:
      - hasDocuments:
          count: 2

      - equal:
          path: metadata.namespace
          value: azure-resources

      - equal:
          path: spec.owner.armId
          value: /subscriptions/example-subscription/resourceGroups/example-identities

      - notExists:
          path: spec.operatorSpec.configMaps.clientId.annotations

      - notExists:
          path: spec.operatorSpec.configMaps.principalId.annotations

      - matchRegex:
          path: spec.operatorSpec.configMaps.clientId.name
          pattern: ^preview-pr-42-poc-(backend|frontend)-[a-f0-9]{12}-client-id$

  - it: omits default Azure sync waves
    values:
      - ../examples/application.yaml
      - ../examples/preview.yaml
      - fixtures/azure.yaml
    set:
      platform.azure.subscriptionId: example-subscription
      platform.azure.tenantId: example-tenant

    asserts:
      - notExists:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]

  - it: applies configured Azure sync waves
    values:
      - ../examples/application.yaml
      - ../examples/preview.yaml
      - fixtures/azure.yaml
    set:
      platform.azure.subscriptionId: example-subscription
      platform.azure.tenantId: example-tenant
      platform.syncWaves:
        userAssignedIdentity: 0

    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: '0'

  - it: renders nothing with empty values

    asserts:
      - hasDocuments:
          count: 0

  - it: provisions identities without an annotated account until client ID exists
    set:
      namespace: identity-stage
      platform.azure.identities:
        backend:
          azureName: id-example-backend
      platform.azure.location: example-region
      platform.azure.subscriptionId: example-subscription
      platform.azure.identityResourceGroup: example-platform
      platform.azure.oidcIssuerUrl: https://issuer.example.invalid/

    asserts:
      - hasDocuments:
          count: 1

  - it: references a shared identity without owning its identity or roles
    values:
      - ../examples/application.yaml
      - ../examples/preview.yaml
      - fixtures/containers.yaml
      - fixtures/shared-identity.yaml

    asserts:
      - hasDocuments:
          count: 0
