suite: RoleAssignment

templates:
  - templates/role-assignment.yaml

release:
  name: poc

tests:

  - it: renders multiple RoleAssignment resources with the expected Azure configuration
    values:
      - ../examples/application.yaml
      - ../examples/preview.yaml
      - fixtures/azure.yaml
    set:
      platform.azure.subscriptionId: example-subscription
      platform.azure.tenantId: example-tenant

    asserts:
      - hasDocuments:
          count: 2

      - equal:
          path: metadata.namespace
          value: azure-resources

      - matchRegex:
          path: spec.azureName
          pattern: ^[a-f0-9-]{36}$

      - matchRegex:
          path: spec.principalIdFromConfig.name
          pattern: ^preview-pr-42-poc-backend-[a-f0-9]{12}-principal-id$

      - equal:
          path: spec.owner.armId
          value: /subscriptions/example-subscription/resourceGroups/example-platform/providers/Microsoft.KeyVault/vaults/example-vault
        documentSelector:
          path: spec.roleDefinitionReference.wellKnownName
          value: Key Vault Secrets User

      - equal:
          path: spec.owner.armId
          value: /subscriptions/example-subscription/resourceGroups/example-platform/providers/Microsoft.Storage/storageAccounts/examplestorage
        documentSelector:
          path: spec.roleDefinitionReference.wellKnownName
          value: Storage Blob Data Reader

  - it: omits default Azure sync waves
    values:
      - ../examples/application.yaml
      - ../examples/preview.yaml
      - fixtures/azure.yaml
    set:
      platform.azure.subscriptionId: example-subscription
      platform.azure.tenantId: example-tenant

    asserts:
      - notExists:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]

  - it: applies configured Azure sync waves
    values:
      - ../examples/application.yaml
      - ../examples/preview.yaml
      - fixtures/azure.yaml
    set:
      platform.azure.subscriptionId: example-subscription
      platform.azure.tenantId: example-tenant
      platform.syncWaves:
        roleAssignment: 10

    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: '10'

  - it: accepts a configured role name
    values:
      - ../examples/application.yaml
      - ../examples/preview.yaml
      - fixtures/azure.yaml
    set:
      platform.azure.subscriptionId: example-subscription
      platform.azure.tenantId: example-tenant
      platform.azure.roleAssignments.backend-blobs.roleName: Storage Blob Data Contributor

    asserts:
      - equal:
          path: spec.roleDefinitionReference.wellKnownName
          value: Storage Blob Data Contributor
        documentSelector:
          path: spec.roleDefinitionReference.wellKnownName
          value: Storage Blob Data Contributor

  - it: renders nothing with empty values

    asserts:
      - hasDocuments:
          count: 0

  - it: references a shared identity without owning its identity or roles
    values:
      - ../examples/application.yaml
      - ../examples/preview.yaml
      - fixtures/containers.yaml
      - fixtures/shared-identity.yaml

    asserts:
      - hasDocuments:
          count: 0

  - it: rejects duplicate ownership of shared identity roles
    values:
      - ../examples/application.yaml
      - ../examples/preview.yaml
      - fixtures/containers.yaml
      - fixtures/shared-identity.yaml
    set:
      platform.azure.roleAssignments:
        reader:
          identity: shared
          roleName: Reader
          scope: storageAccount

    asserts:
      - failedTemplate:
          errorPattern: assign its roles once in platform GitOps
