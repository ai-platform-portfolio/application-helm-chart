suite: Ordered disposable application cleanup

release:
  name: poc

values: [../examples/managed.yaml]

tests:
  - it: renders no cleanup resources by default
    template: templates/lifecycle/cleanup.yaml
    asserts:
      - hasDocuments: {count: 0}

  - it: refuses the safe retained-database default
    set: {platform.lifecycle.cleanup.enabled: true}
    asserts:
      - failedTemplate: {errorPattern: 'cleanup requires reclaimPolicy: delete for database messages'}

  - it: refuses cleanup if any database is retained
    set:
      platform.lifecycle.cleanup.enabled: true
      databases.messages.reclaimPolicy: delete
      databases.audit: {}
    asserts:
      - failedTemplate: {errorPattern: 'cleanup requires reclaimPolicy: delete for database audit'}

  - it: refuses a shared application namespace
    set:
      namespace: atlas-system
      platform.lifecycle.cleanup.enabled: true
    asserts:
      - failedTemplate: {errorPattern: 'cleanup requires an exclusive application namespace'}

  - it: refuses ordering that creates SQL before application cleanup access
    set:
      platform.lifecycle.cleanup.enabled: true
      platform.syncWaves.namespace: -10
    asserts:
      - failedTemplate: {errorPattern: 'cleanup access must precede Atlas roles'}

  - it: refuses orphaning a renamed source credential
    set:
      platform.lifecycle.cleanup.enabled: true
      databases.messages.reclaimPolicy: delete
      platform.credentials.certificates.sample-app-poc-messages-65df31a804f0-client.spec.secretName: another-secret
    asserts:
      - failedTemplate: {errorPattern: 'cleanup requires the generated certificate and connection resource names/namespaces'}

  - it: runs the bounded native deletion Job outside the application namespace without database secrets
    set: {platform.lifecycle.cleanup.enabled: true, databases.messages.reclaimPolicy: delete}
    template: templates/lifecycle/cleanup.yaml
    documentSelector: {path: kind, value: Job}
    asserts:
      - equal: {path: metadata.namespace, value: atlas-system}
      - equal: {path: 'metadata.annotations["argocd.argoproj.io/hook"]', value: PreDelete}
      - equal: {path: spec.activeDeadlineSeconds, value: 900}
      - equal: {path: spec.backoffLimit, value: 3}
      - equal: {path: spec.template.spec.restartPolicy, value: Never}
      - equal: {path: spec.template.spec.securityContext.runAsUser, value: 65532}
      - equal: {path: 'spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem', value: true}
      - notExists: {path: 'spec.template.spec.containers[0].envFrom'}
      - equal: {path: spec.template.spec.volumes, value: [{name: tmp, emptyDir: {}}]}

  - it: grants only named SQL and credential deletion with no shared secret reads
    set: {platform.lifecycle.cleanup.enabled: true, databases.messages.reclaimPolicy: delete}
    template: templates/lifecycle/cleanup.yaml
    documentSelector: {path: 'rules[0].resources[0]', value: databases}
    asserts:
      - equal:
          path: rules
          value:
            - {apiGroups: [postgresql.cnpg.io], resources: [databases], resourceNames: [sample-app-poc-messages-65df31a804f0], verbs: [get, delete]}
            - {apiGroups: [cert-manager.io], resources: [certificates], resourceNames: [sample-app-poc-messages-65df31a804f0-client], verbs: [get, delete]}
            - {apiGroups: [''], resources: [secrets], resourceNames: [sample-app-poc-messages-65df31a804f0-client], verbs: [delete]}

  - it: cannot create schemas or read shared Atlas credentials
    set: {platform.lifecycle.cleanup.enabled: true, databases.messages.reclaimPolicy: delete}
    template: templates/lifecycle/cleanup.yaml
    documentSelector: {path: 'rules[0].resources[0]', value: atlasschemas}
    asserts:
      - equal:
          path: rules
          value:
            - {apiGroups: [db.atlasgo.io], resources: [atlasschemas], resourceNames: [sample-app-poc-roles-747835aca5d2], verbs: [get, patch]}
            - {apiGroups: [db.atlasgo.io], resources: [atlasmigrations], resourceNames: [sample-app-poc-messages-65df31a804f0, sample-app-poc-messages-access-c7b63231604c], verbs: [get, delete]}
            - {apiGroups: [''], resources: [secrets], resourceNames: [io.atlasgo.db.v1.sample-app-poc-messages-access-c7b63231604c.latest], verbs: [delete]}

  - it: creates application access before SQL instead of requiring a successful deployment
    set: {platform.lifecycle.cleanup.enabled: true, databases.messages.reclaimPolicy: delete}
    template: templates/lifecycle/cleanup.yaml
    documentSelector: {path: 'rules[0].resources[0]', value: deployments}
    asserts:
      - equal: {path: metadata.namespace, value: sample-app}
      - equal: {path: 'metadata.annotations["argocd.argoproj.io/sync-wave"]', value: '-39'}
      - notExists: {path: 'metadata.annotations["argocd.argoproj.io/hook"]'}
      - equal: {path: 'rules[0].resourceNames', value: [api, web]}
      - equal: {path: 'rules[0].verbs', value: [get, patch]}

  - it: forwards cleanup settings into the child and enables cascade only with cleanup
    set:
      platform.lifecycle.cleanup.enabled: true
      databases.messages.reclaimPolicy: delete
      platform.argocd.enabled: true
      platform.argocd.repository: https://github.com/example/app.git
      platform.argocd.revision: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      platform.argocd.chartRevision: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    template: templates/argocd/application.yaml
    asserts:
      - equal: {path: metadata.finalizers, value: [resources-finalizer.argocd.argoproj.io]}
      - equal: {path: 'spec.sources[0].helm.valuesObject.platform.lifecycle.cleanup.enabled', value: true}
      - equal: {path: 'spec.sources[0].helm.valuesObject.platform.argocd.enabled', value: false}

  - it: isolates a second app with multiple databases and both workload kinds
    set:
      name: other-app
      namespace: other-app
      platform.lifecycle.cleanup.enabled: true
      databases.messages.reclaimPolicy: delete
      databases.audit.reclaimPolicy: delete
      components.api.delivery: rollout
    template: templates/lifecycle/cleanup.yaml
    documentSelector: {path: kind, value: Job}
    asserts:
      - notMatchRegex: {path: 'spec.template.spec.containers[0].env[1].value', pattern: sample-app}
      - matchRegex: {path: 'spec.template.spec.containers[0].env[1].value', pattern: 'other-app-poc-audit-[a-f0-9]{12}'}
      - matchRegex: {path: 'spec.template.spec.containers[0].env[1].value', pattern: 'other-app-poc-messages-[a-f0-9]{12}'}
      - matchRegex: {path: 'spec.template.spec.containers[0].env[1].value', pattern: '"api":"rollouts.argoproj.io"'}
      - matchRegex: {path: 'spec.template.spec.containers[0].env[1].value', pattern: '"web":"deployments.apps"'}
