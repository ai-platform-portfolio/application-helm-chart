suite: Managed PostgreSQL and persistent registration

release:
  name: poc

tests:
  - it: creates an Azure database under the declared server
    values: [../examples/managed.yaml, ../examples/azure-managed.yaml]
    template: templates/postgres.yaml
    asserts:
      - equal: {path: kind, value: FlexibleServersDatabase}
      - matchRegex: {path: spec.azureName, pattern: '^app_sample_app_poc_messages_[a-f0-9]{12}$'}
      - equal: {path: spec.owner.armId, value: /subscriptions/00000000-0000-0000-0000-000000000001/resourceGroups/example-rg/providers/Microsoft.DBforPostgreSQL/flexibleServers/example-pg}

  - it: manages the runtime SQL login through Atlas and a separate identity mapping migration
    values: [../examples/managed.yaml, ../examples/azure-managed.yaml]
    template: templates/atlas.yaml
    documentSelector: {path: kind, value: AtlasMigration, matchMany: true}
    asserts:
      - hasDocuments: {count: 3, filterAware: true}
      - notExists: {path: spec.credentials}
      - matchRegex: {path: spec.config, pattern: 'data "azure_db_token" "db"'}

  - it: scopes the access migration to public
    values: [../examples/managed.yaml, ../examples/azure-managed.yaml]
    template: templates/atlas.yaml
    documentSelector: {path: spec.revisionsSchema, value: atlas_access_revisions}
    asserts:
      - matchRegex: {path: spec.config, pattern: 'search_path=public'}

  - it: scopes the application migration to public
    values: [../examples/managed.yaml, ../examples/azure-managed.yaml]
    template: templates/atlas.yaml
    documentSelector: {path: spec.revisionsSchema, value: atlas_schema_revisions}
    asserts:
      - matchRegex: {path: spec.config, pattern: 'search_path=public'}

  - it: keeps identity migration database scoped
    values: [../examples/managed.yaml, ../examples/azure-managed.yaml]
    template: templates/atlas.yaml
    documentSelector: {path: spec.revisionsSchema, value: atlas_identity_revisions}
    asserts:
      - notMatchRegex: {path: spec.config, pattern: 'search_path='}

  - it: verifies Azure runtime TLS with the image's system CA bundle
    values: [../examples/managed.yaml, ../examples/azure-managed.yaml]
    template: templates/deployment.yaml
    documentSelector: {path: metadata.name, value: api}
    asserts:
      - matchRegex: {path: 'spec.template.spec.containers[0].env[0].value', pattern: 'sslmode=verify-full&sslrootcert=%2Fetc%2Fssl%2Fcerts%2Fca-certificates.crt'}

  - it: creates independent persistent registrations from one repository intent
    values: [../examples/azure-managed.yaml, ../examples/persistent-registration.yaml]
    template: templates/argocd/environments.yaml
    documentSelector: {path: kind, value: ApplicationSet, matchMany: true}
    asserts:
      - hasDocuments: {count: 2, filterAware: true}
      - matchRegex: {path: spec.template.spec.source.targetRevision, pattern: '\{\{\.release.version\}\}'}
      - matchRegex: {path: spec.template.spec.source.helm.valuesObject.hostname, pattern: '^second(\.staging)?\.example\.test$'}

  - it: registers an internal target without inventing a hostname
    values: [../examples/azure-managed.yaml]
    template: templates/argocd/environments.yaml
    set:
      platform.argocd.repository: https://github.com/example/internal-service.git
      platform.argocd.environments.enabled: true
      platform.argocd.environments.targets:
        staging: {}
    asserts:
      - hasDocuments: {count: 1}
      - matchRegex: {path: metadata.name, pattern: '^internal-service-[a-f0-9]{12}-staging$'}
      - equal: {path: spec.template.spec.source.helm.valuesObject.hostname, value: ''}
      - equal: {path: spec.template.spec.source.helm.valuesObject.platform.postgres.backend, value: azure}
      - equal: {path: spec.template.spec.source.helm.valuesObject.platform.lifecycle.cleanup.enabled, value: true}

  - it: allows an internal target alongside a hosted target
    values: [../examples/azure-managed.yaml]
    template: templates/argocd/environments.yaml
    set:
      platform.argocd.repository: https://github.com/example/second-application.git
      platform.argocd.environments.enabled: true
      platform.argocd.environments.targets:
        staging: {}
        production: {hostname: second.example.test}
    documentSelector: {path: 'metadata.labels["platform.ai-platform-portfolio/environment"]', value: staging}
    asserts:
      - equal: {path: spec.template.spec.source.helm.valuesObject.hostname, value: ''}
      - matchRegex: {path: spec.template.spec.destination.namespace, pattern: '^second-application-[a-f0-9]{12}-staging$'}

  - it: preserves the hosted target in a mixed registration
    values: [../examples/azure-managed.yaml]
    template: templates/argocd/environments.yaml
    set:
      platform.argocd.repository: https://github.com/example/second-application.git
      platform.argocd.environments.enabled: true
      platform.argocd.environments.targets:
        staging: {}
        production: {hostname: second.example.test}
    documentSelector: {path: 'metadata.labels["platform.ai-platform-portfolio/environment"]', value: production}
    asserts:
      - equal: {path: spec.template.spec.source.helm.valuesObject.hostname, value: second.example.test}
      - matchRegex: {path: spec.template.spec.destination.namespace, pattern: '^second-application-[a-f0-9]{12}-production$'}

  - it: renders no ingress for an API-only child with no hosts or routes
    template: templates/gateway-routes.yaml
    set:
      name: internal-service
      hostname: ''
      components.api:
        image: example.test/api@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
        port: 8000
    asserts:
      - hasDocuments: {count: 0}

  - it: retains the internal API Service without ingress
    template: templates/service.yaml
    set:
      name: internal-service
      hostname: ''
      components.api:
        image: example.test/api@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
        port: 8000
    asserts:
      - hasDocuments: {count: 1}
      - equal: {path: metadata.name, value: api}
      - equal: {path: 'spec.ports[0].port', value: 8000}
      - notExists: {path: spec.type}
