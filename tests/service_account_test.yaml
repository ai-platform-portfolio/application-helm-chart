suite: ServiceAccount

templates:
  - templates/service-account.yaml

release:
  name: poc

tests:

  - it: renders multiple ServiceAccount resources with the expected Azure configuration
    values:
      - ../examples/application.yaml
      - ../examples/preview.yaml
      - fixtures/azure.yaml
    set:
      platform.azure.subscriptionId: example-subscription
      platform.azure.tenantId: example-tenant

    asserts:
      - hasDocuments:
          count: 2

      - equal:
          path: metadata.annotations["azure.workload.identity/tenant-id"]
          value: example-tenant

      - matchRegex:
          path: metadata.annotations["azure.workload.identity/client-id"]
          pattern: ^00000000-0000-0000-0000-00000000000[12]$

  - it: omits default Azure sync waves
    values:
      - ../examples/application.yaml
      - ../examples/preview.yaml
      - fixtures/azure.yaml
    set:
      platform.azure.subscriptionId: example-subscription
      platform.azure.tenantId: example-tenant

    asserts:
      - notExists:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]

  - it: applies configured Azure sync waves
    values:
      - ../examples/application.yaml
      - ../examples/preview.yaml
      - fixtures/azure.yaml
    set:
      platform.azure.subscriptionId: example-subscription
      platform.azure.tenantId: example-tenant
      platform.syncWaves:
        serviceAccount: 2

    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: '2'

  - it: renders nothing with empty values

    asserts:
      - hasDocuments:
          count: 0

  - it: provisions identities without an annotated account until client ID exists
    set:
      namespace: identity-stage
      platform.azure.identities:
        backend:
          azureName: id-example-backend
      platform.azure.location: example-region
      platform.azure.subscriptionId: example-subscription
      platform.azure.identityResourceGroup: example-platform
      platform.azure.oidcIssuerUrl: https://issuer.example.invalid/

    asserts:
      - hasDocuments:
          count: 0

  - it: references a shared identity without owning its identity or roles
    values:
      - ../examples/application.yaml
      - ../examples/preview.yaml
      - fixtures/containers.yaml
      - fixtures/shared-identity.yaml

    asserts:
      - equal:
          path: metadata.annotations["azure.workload.identity/client-id"]
          value: 00000000-0000-0000-0000-000000000003
