suite: Atlas roles migrations and credential access

templates:
  - templates/atlas.yaml

release:
  name: poc

tests:
  - it: renders no Atlas resources by default
    asserts:
      - hasDocuments:
          count: 0

  - it: scopes role reconciliation to the explicit platform ownership list
    values:
      - fixtures/postgres.yaml
    documentSelector:
      path: kind
      value: AtlasSchema
    asserts:
      - equal:
          path: metadata.namespace
          value: atlas-system

      - equal:
          path: spec.urlFrom.secretKeyRef
          value: {name: atlas-postgres, key: url}

      - equal:
          path: spec.policy.lint
          value: {review: ERROR, destructive: {error: true}}

      - matchRegex:
          path: spec.config
          pattern: 'include = \[\s+"preview_pr42_owner\[type=role\|user\]",\s+"preview_pr42_migrator\[type=role\|user\]",\s+"preview_pr42_app\[type=role\|user\]",\s+\]'

      - matchRegex:
          path: spec.config
          pattern: 'schemas\s+= false\s+objects\s+= false\s+roles\s+= true\s+permissions\s+= false'

      - matchRegex:
          path: spec.schema.hcl
          pattern: 'member_of = \[\s+role.preview_pr42_owner,'

      - equal:
          path: spec.vars[0].valueFrom.secretKeyRef
          value: {name: preview-pr42-runtime, key: password}

      - notExists:
          path: metadata.annotations

  - it: pins multiple registry migrations and blocks implicit schema downgrades
    values:
      - fixtures/postgres.yaml
    documentSelector:
      path: kind
      value: AtlasMigration
      matchMany: true
    asserts:
      - hasDocuments:
          count: 2
          filterAware: true

      - equal:
          path: spec.protectedFlows.migrateDown.allow
          value: false

      - equal:
          path: spec.cloud.tokenFrom.secretKeyRef
          value: {name: atlas-token-secret, key: ATLAS_TOKEN}

      - equal:
          path: spec.credentials.parameters
          value:
            sslmode: verify-full
            sslrootcert: /etc/atlas-postgres/ca.crt

      - equal:
          path: spec.credentials.host
          value: platform-rw.postgres.svc.cluster.local

      - equal:
          path: spec.credentials.passwordFrom.secretKeyRef
          value: {name: preview-pr42-migrator, key: password}

      - equal:
          path: spec.dir.remote.tag
          value: commit-123
        documentSelector:
          path: spec.dir.remote.name
          value: preview-poc

  - it: grants the existing operator only named credential reads
    values:
      - fixtures/postgres.yaml
    documentSelector:
      path: kind
      value: Role
    asserts:
      - equal:
          path: rules
          value:
            - apiGroups: ['']
              resources: [secrets]
              resourceNames:
                - atlas-postgres
                - atlas-token-secret
                - preview-pr42-migrator
                - preview-pr42-runtime
              verbs: [get]

  - it: adds optional sync waves to each Atlas resource and its credential access
    values:
      - fixtures/postgres.yaml
    set:
      platform.syncWaves.atlasSchema: -20
      platform.syncWaves.atlasMigration: 0
      platform.syncWaves.atlasAccess: -30
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: '-20'
        documentSelector: {path: kind, value: AtlasSchema}

      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: '0'
        documentSelector: {path: kind, value: AtlasMigration, matchMany: true}

      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: '-30'
        documentSelector: {path: kind, value: RoleBinding}

  - it: keeps a second preview role scope independent of the first
    set:
      namespace: preview-pr-43
      postgres.roles:
        preview_pr43_owner: {}
      platform.atlas.roleScope: [preview_pr43_owner]
      platform.atlas.rolePlanRepository: preview-roles
    documentSelector: {path: kind, value: AtlasSchema}
    asserts:
      - matchRegex:
          path: spec.config
          pattern: '"preview_pr43_owner\[type=role\|user\]"'

      - notMatchRegex:
          path: spec.config
          pattern: preview_pr42

      - notExists:
          path: spec.vars

  - it: can retain an ownership scope with an empty desired role set for controlled cleanup
    set:
      namespace: preview-pr-42
      platform.atlas.roleScope: [preview_pr42_owner]
      platform.atlas.rolePlanRepository: preview-roles
    documentSelector: {path: kind, value: AtlasSchema}
    asserts:
      - equal:
          path: spec.schema.hcl
          value: ''

      - equal:
          path: spec.policy.lint.destructive.error
          value: true

  - it: refuses role management without an explicit ownership scope
    set:
      namespace: example
      postgres.roles:
        app_owner: {}
    asserts:
      - failedTemplate:
          errorPattern: roleScope must explicitly list

  - it: refuses a role outside the declared scope
    set:
      namespace: example
      postgres.roles:
        other_app_owner: {}
      platform.atlas.roleScope: [app_owner]
      platform.atlas.rolePlanRepository: preview-roles
    asserts:
      - failedTemplate:
          errorPattern: outside platform.atlas.roleScope

  - it: refuses membership of an unmanaged privileged role
    values:
      - fixtures/postgres.yaml
    set:
      postgres.roles.preview_pr42_app.memberOf: [pg_write_all_data]
    asserts:
      - failedTemplate:
          errorPattern: unmanaged membership

  - it: rejects login roles without a password Secret reference
    set:
      namespace: example
      postgres.roles:
        app_user: {login: true}
      platform.atlas.roleScope: [app_user]
      platform.atlas.rolePlanRepository: preview-roles
    asserts:
      - failedTemplate:
          errorPattern: needs passwordSecret

  - it: rejects floating migration tags
    set:
      namespace: example
      postgres.migrations.api:
        database: api
        role: app_migrator
        repository: example
        tag: latest
    asserts:
      - failedTemplate:
          errorPattern: tag

  - it: refuses a migration that references an undeclared database
    values:
      - fixtures/postgres.yaml
    set:
      postgres.migrations.api.database: missing
    asserts:
      - failedTemplate:
          errorPattern: undefined database missing

  - it: accepts a dedicated dev database Secret without broadening Secret access
    values:
      - fixtures/postgres.yaml
    set:
      postgres.migrations.api.devURLSecret: preview-pr42-dev
    asserts:
      - equal:
          path: spec.devURLFrom.secretKeyRef
          value: {name: preview-pr42-dev, key: url}
        documentSelector: {path: spec.dir.remote.name, value: preview-poc}

      - contains:
          path: rules[0].resourceNames
          content: preview-pr42-dev
        documentSelector: {path: kind, value: Role}

  - it: renders native inline role templates with private history and an earlier wave
    values: [../examples/database-access.yaml]
    documentSelector: {path: spec.revisionsSchema, value: atlas_access_revisions}
    set:
      platform.atlas.migrateDown: {allow: true, autoApprove: true}
      platform.syncWaves.atlasMigration: 4
    asserts:
      - equal:
          path: spec.credentials.parameters.search_path
          value: public
      - equal:
          path: spec.credentials.parameters.sslmode
          value: verify-full
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: '-5'
      - matchRegex:
          path: spec.config
          pattern: '"runtime" = "preview_pr42_app"'
      - matchRegex:
          path: spec.config
          pattern: 'dir = data.template_dir.migrations.url'
      - matchRegex:
          path: spec.dir.local["1_access.sql"]
          pattern: 'ALTER DEFAULT PRIVILEGES IN SCHEMA public'
      - notExists:
          path: spec.dir.local["atlas.sum"]
      - notExists:
          path: spec.dir.remote
      - equal:
          path: spec.protectedFlows.migrateDown
          value: {allow: false}

  - it: keeps the application artifact separate from the inline access stream
    values: [../examples/database-access.yaml]
    documentSelector: {path: spec.revisionsSchema, value: atlas_schema_revisions}
    asserts:
      - equal:
          path: spec.credentials.parameters.search_path
          value: public
      - equal:
          path: spec.dir.remote.name
          value: preview-environments
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: '0'
      - notExists:
          path: spec.config
      - notExists:
          path: spec.dir.local

  - it: rejects two streams sharing a database history
    values: [../examples/database-access.yaml]
    set:
      postgres.migrations.api.revisionsSchema: atlas_access_revisions
    asserts:
      - failedTemplate:
          errorPattern: shares database/history

  - it: rejects application-schema history exposure
    values: [../examples/database-access.yaml]
    set:
      postgres.migrations.api.revisionsSchema: public
    asserts:
      - failedTemplate:
          errorPattern: must keep revisionsSchema separate

  - it: requires private history for schema-scoped registry migrations
    values: [fixtures/postgres.yaml]
    set:
      postgres.migrations.api.schema: public
    asserts:
      - failedTemplate:
          errorPattern: needs revisionsSchema

  - it: rejects templates referencing undeclared roles
    values: [../examples/database-access.yaml]
    set:
      postgres.migrations.access.roleVars.runtime: postgres
    asserts:
      - failedTemplate:
          errorPattern: references unmanaged role postgres

  - it: rejects mixed inline and registry sources
    values: [../examples/database-access.yaml]
    set:
      postgres.migrations.access.repository: other
      postgres.migrations.access.tag: commit-sha
    asserts:
      - failedTemplate:
          errorPattern: oneOf

  - it: rejects unsafe template identifiers
    values: [../examples/database-access.yaml]
    set:
      postgres.migrations.access.roleVars.runtime: 'bad"; GRANT ALL'
    asserts:
      - failedTemplate:
          errorPattern: roleVars

  - it: grants inline directory state access without credential updates or Secret discovery
    values: [../examples/database-access.yaml]
    documentSelector: {path: kind, value: Role}
    asserts:
      - lengthEqual:
          path: rules
          count: 3
      - equal:
          path: rules[0].verbs
          value: [get]
      - matchRegex:
          path: rules[1].resourceNames[0]
          pattern: '^io\.atlasgo\.db\.v1\.preview-pr-42-poc-access-[a-f0-9]{12}\.latest$'
      - equal:
          path: rules[1].verbs
          value: [get, update]
      - equal:
          path: rules[2]
          value: {apiGroups: [''], resources: [secrets], verbs: [create]}

  - it: rejects combining certificate authentication with a password Secret
    values: [fixtures/postgres.yaml]
    set:
      postgres.roles.preview_pr42_app.authentication: certificate
    asserts:
      - failedTemplate: {errorPattern: 'certificate role preview_pr42_app requires login and must not set passwordSecret'}

  - it: rejects certificate authentication on a non-login role
    values: [fixtures/postgres.yaml]
    set:
      postgres.roles.preview_pr42_owner.authentication: certificate
    asserts:
      - failedTemplate: {errorPattern: 'certificate role preview_pr42_owner requires login and must not set passwordSecret'}

  - it: keeps password Secret variables only for password roles in a mixed release
    set:
      namespace: mixed-preview
      postgres.roles:
        preview_pr42_app: {login: true, authentication: certificate}
        preview_pr42_migrator: {login: true, passwordSecret: legacy-migration}
      platform.atlas.roleScope: [preview_pr42_app, preview_pr42_migrator]
      platform.atlas.rolePlanRepository: mixed-roles
    documentSelector: {path: kind, value: AtlasSchema}
    asserts:
      - lengthEqual: {path: spec.vars, count: 1}
      - equal: {path: 'spec.vars[0].key', value: password_preview_pr42_migrator}
      - notMatchRegex: {path: spec.schema.hcl, pattern: 'password_preview_pr42_app'}
