suite: Reusable credential delivery

templates:
  - templates/credentials/secrets.yaml
  - templates/credentials/access.yaml
  - templates/namespace.yaml

tests:
  - it: renders no credentials or namespace by default
    asserts:
      - hasDocuments: {count: 0}

  - it: binds native specs and ESO expressions to one application namespace
    template: templates/credentials/secrets.yaml
    set:
      namespace: app-one
      platform.credentials.externalSecrets.runtime:
        metadata:
          annotations: {argocd.argoproj.io/sync-wave: '-30'}
        spec:
          secretStoreRef: {name: vault-one, kind: SecretStore}
          target:
            template:
              data: {url: '{{ .password }}'}
    asserts:
      - equal: {path: metadata.name, value: runtime}
      - equal: {path: metadata.namespace, value: app-one}
      - equal: {path: metadata.annotations, value: {argocd.argoproj.io/sync-wave: '-30'}}
      - equal: {path: spec.secretStoreRef.name, value: vault-one}
      - equal: {path: spec.target.template.data.url, value: '{{ .password }}'}

  - it: supports another application and same-name copies across namespaces
    template: templates/credentials/secrets.yaml
    set:
      namespace: app-two
      platform.credentials.externalSecrets.source:
        metadata: {name: database, namespace: shared-secrets}
        spec: {target: {name: database}}
      platform.credentials.externalSecrets.copy:
        metadata: {name: database}
        spec:
          secretStoreRef: {name: store-two, kind: SecretStore}
          data: [{secretKey: password, remoteRef: {key: database, property: password}}]
    asserts:
      - hasDocuments: {count: 2}
      - equal: {path: metadata.name, value: database}
      - equal:
          path: metadata.namespace
          value: app-two
        documentSelector: {path: spec.secretStoreRef.name, value: store-two}
      - equal:
          path: metadata.namespace
          value: shared-secrets
        documentSelector: {path: spec.target.name, value: database}

  - it: keeps reader grants explicit and disables automatic service account tokens
    template: templates/credentials/access.yaml
    set:
      namespace: app-two
      platform.credentials.serviceAccounts.reader: {}
      platform.credentials.roles.reader:
        metadata: {namespace: shared-secrets}
        rules: [{apiGroups: [''], resources: [secrets], resourceNames: [app-two-password], verbs: [get]}]
      platform.credentials.roleBindings.reader:
        metadata: {namespace: shared-secrets}
        roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: reader}
        subjects: [{kind: ServiceAccount, name: reader, namespace: app-two}]
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: false
        documentSelector: {path: kind, value: ServiceAccount}
      - equal:
          path: rules[0]
          value: {apiGroups: [''], resources: [secrets], resourceNames: [app-two-password], verbs: [get]}
        documentSelector: {path: kind, value: Role}
      - equal:
          path: subjects[0].namespace
          value: app-two
        documentSelector: {path: kind, value: RoleBinding}

  - it: creates the application namespace for credential-only callers
    template: templates/namespace.yaml
    set:
      namespace: app-two
      platform.credentials.serviceAccounts.reader: {}
    asserts:
      - equal: {path: metadata.name, value: app-two}

  - it: rejects a delivery resource without a native spec
    set:
      namespace: app-one
      platform.credentials.externalSecrets.runtime: {}
    asserts:
      - failedTemplate: {errorPattern: spec}
