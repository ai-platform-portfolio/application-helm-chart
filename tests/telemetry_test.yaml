suite: scoped telemetry queries
templates:
  - templates/telemetry-access.yaml
set:
  name: hosted-reader
  platform.modelGateway.connectionOnly: true
  platform.telemetry:
    hostname: telemetry.example.test
    namespace: disposable-preview
    workload: api
    tenantId: 00000000-0000-4000-8000-000000000001
    audience: 00000000-0000-4000-8000-000000000002
    apiPrincipalId: 00000000-0000-4000-8000-000000000003
    roleId: 00000000-0000-4000-8000-000000000004
tests:
  - it: preserves the ordinary two-query connection
    asserts:
      - notMatchRegex:
          path: 'data["telemetry.json"]'
          pattern: '"image"'

  - it: filters readiness Events by Pod name in the LogQL pipeline
    asserts:
      - matchRegex:
          path: 'data["telemetry.json"]'
          pattern: '"events":"query=%7Bsource%3D%22kubernetes-events%22%2Cnamespace%3D%22disposable-preview%22%2Creason%3D%22Unhealthy%22%7D\+%7C%3D\+%22Readiness\+probe\+failed%3A%22\+%7C\+name%3D~%22%5Eapi%28-%5Ba-z0-9%5D%2B-%5Ba-z0-9%5D%2B%29%3F%24%22\\u0026since=5m\\u0026limit=20"'

  - it: pins the image query to the exact namespace, Pod UID and container
    set:
      platform.telemetry.pod:
        name: api-abc-def
        uid: 00000000-0000-4000-8000-000000000005
        container: api
    asserts:
      - matchRegex:
          path: 'data["telemetry.json"]'
          pattern: '"image":"query=timestamp%28kube_pod_container_info%7Bnamespace%3D%22disposable-preview%22%2Cpod%3D%22api-abc-def%22%2Cuid%3D%2200000000-0000-4000-8000-000000000005%22%2Ccontainer%3D%22api%22%7D%29"'

  - it: rejects an unpinned Pod query
    set:
      platform.telemetry.pod:
        name: api-abc-def
        uid: invalid
        container: api
    asserts:
      - failedTemplate:
          errorPattern: Telemetry requires an exact pod UID
