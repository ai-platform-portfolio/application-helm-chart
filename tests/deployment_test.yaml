suite: Deployment

templates:
  - templates/deployment.yaml

release:
  name: poc

tests:

  - it: renders preview Deployment resources
    values:
      - ../examples/application.yaml
      - ../examples/preview.yaml

    asserts:
      - hasDocuments:
          count: 1

      - equal:
          path: metadata.namespace
          value: preview-pr-42

      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true

      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: frontend

  - it: renders staging Deployment resources
    values:
      - ../examples/application.yaml
      - ../examples/staging.yaml

    asserts:
      - hasDocuments:
          count: 1

      - equal:
          path: metadata.namespace
          value: poc-staging

  - it: renders production Deployment resources
    values:
      - ../examples/application.yaml
      - ../examples/production.yaml

    asserts:
      - hasDocuments:
          count: 1

      - equal:
          path: metadata.namespace
          value: poc-production

  - it: scales component and host maps with merged resource defaults
    values:
      - ../examples/application.yaml
      - ../examples/preview.yaml
      - fixtures/extra.yaml

    asserts:
      - hasDocuments:
          count: 2

      - equal:
          path: spec.replicas
          value: 2
        documentSelector:
          path: metadata.name
          value: worker

      - equal:
          path: spec.template.spec.containers[0].resources.requests
          value:
            cpu: 250m
            memory: 128Mi
        documentSelector:
          path: metadata.name
          value: worker

  - it: renders another application without the example components
    values:
      - fixtures/extra.yaml
    set:
      namespace: another-app

    asserts:
      - hasDocuments:
          count: 1

  - it: can override image pull policy
    values:
      - ../examples/application.yaml
      - ../examples/preview.yaml
      - fixtures/extra.yaml
    set:
      platform.gateway.httpRedirect.enabled: false
      platform.pod.imagePullPolicy: Always

    asserts:
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: Always

  - it: renders sidecars and init containers with platform defaults
    values:
      - ../examples/application.yaml
      - ../examples/preview.yaml
      - fixtures/containers.yaml

    asserts:
      - lengthEqual:
          path: spec.template.spec.containers
          count: 2

      - lengthEqual:
          path: spec.template.spec.initContainers
          count: 1

      - equal:
          path: spec.template.spec.containers[1].securityContext.readOnlyRootFilesystem
          value: true

      - equal:
          path: spec.template.spec.initContainers[0].securityContext.readOnlyRootFilesystem
          value: true

      - equal:
          path: spec.template.spec.containers[1].name
          value: telemetry

      - equal:
          path: spec.template.spec.containers[1].ports[0].containerPort
          value: 9090

      - equal:
          path: spec.template.spec.containers[1].resources.requests
          value:
            cpu: 25m
            memory: 128Mi

      - equal:
          path: spec.template.spec.initContainers[0].name
          value: prepare

  - it: omits sync waves unless configured
    values:
      - ../examples/application.yaml
      - ../examples/preview.yaml

    asserts:
      - notExists:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]

  - it: applies sync waves to every resource of each kind
    values:
      - ../examples/application.yaml
      - ../examples/preview.yaml
    set:
      platform.syncWaves:
        deployment: 0

    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: '0'

  - it: renders multiple Deployment resources with the expected Azure configuration
    values:
      - ../examples/application.yaml
      - ../examples/preview.yaml
      - fixtures/azure.yaml
    set:
      platform.azure.subscriptionId: example-subscription
      platform.azure.tenantId: example-tenant

    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: frontend

      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false

      - equal:
          path: spec.template.metadata.labels["azure.workload.identity/use"]
          value: 'true'

      - notExists:
          path: spec.template.spec.containers[0].env

      - notExists:
          path: spec.template.spec.volumes[*].projected

  - it: renders nothing with empty values

    asserts:
      - hasDocuments:
          count: 0

  - it: rejects undefined identity
    values:
      - ../examples/application.yaml
      - ../examples/preview.yaml
      - fixtures/containers.yaml
    set:
      components.frontend.identity: missing

    asserts:
      - failedTemplate:
          errorPattern: references undefined identity missing

  - it: rejects mutable image
    values:
      - ../examples/application.yaml
      - ../examples/preview.yaml
      - fixtures/containers.yaml
    set:
      components.frontend.image: frontend:latest

    asserts:
      - failedTemplate:
          errorPattern: frontend.*image|image.*frontend

  - it: rejects mutable sidecar image
    values:
      - ../examples/application.yaml
      - ../examples/preview.yaml
      - fixtures/containers.yaml
    set:
      components.frontend.sidecars.telemetry.image: telemetry:latest

    asserts:
      - failedTemplate:
          errorPattern: telemetry.*image|image.*telemetry

  - it: keeps credentials component-scoped and database readiness separate from liveness
    values: [../examples/application.yaml, ../examples/preview.yaml]
    set:
      components.frontend.env:
        - name: DATABASE_URL
          valueFrom: {secretKeyRef: {name: runtime, key: url}}
      components.frontend.readinessProbe.httpGet.path: /readyz
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[0].valueFrom.secretKeyRef
          value: {name: runtime, key: url}
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet
          value: {path: /readyz, port: http}
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /

  - it: renders a portless worker without default HTTP probes
    set:
      namespace: worker-test
      components: &id001
        worker:
          image: example/worker@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          command:
          - python
          - -m
          - backend.worker
          args:
          - --once
    asserts:
    - equal:
        path: spec.template.spec.containers[0].command
        value:
        - python
        - -m
        - backend.worker
    - equal:
        path: spec.template.spec.containers[0].args
        value:
        - --once
    - notExists:
        path: spec.template.spec.containers[0].ports
    - notExists:
        path: spec.template.spec.containers[0].readinessProbe
    - notExists:
        path: spec.template.spec.containers[0].livenessProbe
  - it: renders explicit worker probes without inherited HTTP handlers
    set:
      namespace: worker-test
      components: *id001
      components.worker.readinessProbe:
        exec:
          command:
          - 'true'
        periodSeconds: 5
      components.worker.livenessProbe:
        exec:
          command:
          - 'true'
    asserts:
    - equal:
        path: spec.template.spec.containers[0].readinessProbe
        value:
          exec:
            command:
            - 'true'
          periodSeconds: 5
    - equal:
        path: spec.template.spec.containers[0].livenessProbe
        value:
          exec:
            command:
            - 'true'
  - it: replaces default HTTP handlers for explicit web exec probes
    values:
    - ../examples/application.yaml
    - ../examples/preview.yaml
    set:
      components.frontend.readinessProbe:
        exec:
          command:
          - 'true'
      components.frontend.livenessProbe:
        exec:
          command:
          - 'true'
    asserts:
    - notExists:
        path: spec.template.spec.containers[0].readinessProbe.httpGet
    - notExists:
        path: spec.template.spec.containers[0].livenessProbe.httpGet
    - equal:
        path: spec.template.spec.containers[0].readinessProbe.exec.command
        value:
        - 'true'
  - it: rejects portless rollouts
    set:
      namespace: worker-test
      components: *id001
      components.worker.delivery: rollout
    asserts:
    - failedTemplate:
        errorPattern: port
  - it: rejects portless routes
    set:
      namespace: worker-test
      components: *id001
      components.worker.route:
        host: web
        path: /
    asserts:
    - failedTemplate:
        errorPattern: port
  - it: rejects portless HTTP probes
    set:
      namespace: worker-test
      components: *id001
      components.worker.readinessProbe:
        httpGet:
          path: /
    asserts:
    - failedTemplate:
        errorPattern: requires a port
  - it: rejects portless implicit routes
    set:
      namespace: worker-test
      components: *id001
      hostname: worker.example.test
      platform.gateway.defaultComponent: worker
    asserts:
    - failedTemplate:
        errorPattern: requires a port
