# Application values normally set only namespace, hosts and components.
namespace: ""
hosts: {}
components: {}

# Platform environment inputs; empty maps render no database resources.
postgres:
  databases: {}
  roles: {}
  # Registry artifacts or small inline versioned SQL directories (see examples/database-access.yaml).
  migrations: {}

# Platform defaults. Applications can override replicas or resources when needed.
platform:
  # Native ESO and credential-reader resources; keys are names, specs stay native.
  credentials:
    passwords: {}
    externalSecrets: {}
    secretStores: {}
    serviceAccounts: {}
    roles: {}
    roleBindings: {}

  # Optional Argo CD sync wave per resource kind; omit a key for no annotation.
  syncWaves: {}

  postgres:
    namespace: postgres
    cluster: platform
    databaseReclaimPolicy: retain

  atlas:
    namespace: atlas-system
    serviceAccount: atlas-operator
    roleEnvironment: roles
    roleScope: []
    rolePlanRepository: ""
    roleConnectionSecret: atlas-postgres
    connectionKey: url
    passwordKey: password
    cloudTokenSecret: atlas-token-secret
    cloudTokenKey: ATLAS_TOKEN
    roleReview: ERROR
    blockDestructiveRoles: true
    migrateDown:
      allow: false

    connection:
      scheme: postgres
      host: platform-rw.postgres.svc.cluster.local
      port: 5432
      parameters:
        sslmode: verify-full
        sslrootcert: /etc/atlas-postgres/ca.crt

  # Platform-owned Azure settings. Applications without Azure access leave these empty.
  # Each identity creates a new UAI by default; create: false references a shared UAI.
  # Role grants apply only to new identities and are disabled unless explicitly requested.
  azure:
    resourceNamespace: azure-resources
    federationAudience: api://AzureADTokenExchange
    subscriptionId: ""
    tenantId: ""
    oidcIssuerUrl: ""
    location: ""
    identityResourceGroup: ""
    keyVault: {name: "", resourceGroup: ""}
    storageAccount: {name: "", resourceGroup: ""}
    identities: {}
    roleAssignments: {}
    storageContainers: {}

  namespaceLabels:
    pod-security.kubernetes.io/enforce: restricted
    gitops.platform/gateway: public

  gateway:
    name: public
    namespace: envoy-gateway-system
    clusterIssuer: letsencrypt-azuredns
    pathMatchType: PathPrefix
    listener:
      name: https
      protocol: HTTPS
      port: 443
      tlsMode: Terminate
      allowedRoutesFrom: Same
    httpRedirect:
      enabled: true
      listenerName: http
      scheme: https
      statusCode: 301

  replicas: 1
  revisionHistoryLimit: 2
  httpPortName: http

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

  pod:
    imagePullPolicy: IfNotPresent
    securityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ALL]
    volumeMounts:
      - {name: tmp, mountPath: /tmp}
      - {name: nginx-cache, mountPath: /var/cache/nginx}
    volumes:
      - {name: tmp, emptyDir: {}}
      - {name: nginx-cache, emptyDir: {}}

  probes:
    readiness:
      httpGet: {port: http}
    liveness:
      httpGet: {port: http}

  rollout:
    maxSurge: 1
    maxUnavailable: 0
    initialStableWeight: 100
    initialCanaryWeight: 0
    steps:
      - setWeight: 100
