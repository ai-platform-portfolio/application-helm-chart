# Minimal developer intent. Advanced resource maps below remain available.
name: ""
hostname: ""
databases: {}
storage: {}

# Application values normally set only namespace, hosts and components.
namespace: ""
hosts: {}
components: {}

# Platform environment inputs; empty maps render no database resources.
postgres:
  databases: {}
  roles: {}
  # Registry artifacts or small inline versioned SQL directories (see examples/database-access.yaml).
  migrations: {}

# Platform defaults. Applications can override replicas or resources when needed.
platform:
  models: {}
  telemetryEndpoint: ""
  tests:
    playwright:
      enabled: false
      path: frontend
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      timeoutSeconds: 900

  release:
    # Delivery automation supplies the expected source SHA; empty disables the check.
    expectedRevision: ""
    check:
      enabled: false
      repository: ""
      workflow: .github/workflows/publish.yml
      pullRequest: ""
      environment: ""
      tokenSecret: argocd-github-api
      image: python:3.12-slim@sha256:aa943ce411423c7582288f18707ff66eddcbaeb510502d747a72aeb34f30d159
      timeoutSeconds: 60

  lifecycle:
    cleanup:
      enabled: false
      # Native kubectl deletes only leftover source client Secrets. No shell/SQL.
      image: registry.k8s.io/kubectl:v1.36.5@sha256:0667e3f3e6ef435d7cd4c16684244703ebd67314c17511c2a9f87ea44f6cdf6b
      timeoutSeconds: 900

  argocd:
    enabled: false
    namespace: argocd
    project: default
    repository: ""
    revision: ""
    chartRepository: https://github.com/ai-platform-portfolio/application-helm-chart.git
    chartRevision: ""
    valuesPath: deploy/values.yaml
    previews:
      enabled: false
      generateHostname: true
      registry: localacrk8s.azurecr.io
      domain: preview.dev.michaelalinks.com
      sharedListener: preview-https
      workflow: .github/workflows/publish.yml
      tokenSecret: argocd-github-api
    environments:
      enabled: false
      registry: localacrk8s.azurecr.io
      # Each target reads deploy/environments/<name>/release.yaml from the delivery branch.
      targets: {}

  kargo:
    enabled: false
    github:
      appId: ""
      installationId: ""
      privateKeyRemoteKey: ""
    verification:
      image: registry.k8s.io/kubectl:v1.36.5@sha256:0667e3f3e6ef435d7cd4c16684244703ebd67314c17511c2a9f87ea44f6cdf6b

  # Native ESO and credential-reader resources; keys are names, specs stay native.
  credentials:
    passwords: {}
    certificates: {}
    externalSecrets: {}
    secretStores: {}
    serviceAccounts: {}
    roles: {}
    roleBindings: {}

  # Optional Argo CD sync wave per resource kind; omit a key for no annotation.
  syncWaves: {}

  postgres:
    backend: cnpg
    namespace: postgres
    cluster: platform
    databaseReclaimPolicy: retain
    caSecret: ""
    clientCertificate:
      issuerRef: {name: postgres-client, kind: Issuer}
      duration: 720h
      renewBefore: 168h
    azure:
      serverName: ""
      serverResourceGroup: ""
      caBundlePath: /etc/ssl/certs/ca-certificates.crt

  atlas:
    namespace: atlas-system
    sourceStore: atlas-postgres
    sourceReader: atlas-secret-reader
    serviceAccount: atlas-operator
    roleEnvironment: roles
    roleScope: []
    rolePlanRepository: ""
    roleConnectionSecret: atlas-postgres
    connectionKey: url
    passwordKey: password
    # The shared Atlas certificate is mounted once by the PostgreSQL package.
    clientCertificate:
      sslcert: /etc/atlas-postgres/tls.crt
      sslkey: /etc/atlas-postgres/tls.key
    cloudTokenSecret: atlas-token-secret
    cloudTokenKey: ATLAS_TOKEN
    azureAdminUser: ""
    roleReview: ERROR
    blockDestructiveRoles: true
    migrateDown:
      allow: false

    connection:
      scheme: postgres
      host: platform-rw.postgres.svc.cluster.local
      port: 5432
      parameters:
        sslmode: verify-full
        sslrootcert: /etc/atlas-postgres/ca.crt

  # Platform-owned Azure settings. Applications without Azure access leave these empty.
  # Each identity creates a new UAI by default; create: false references a shared UAI.
  # Role grants apply only to new identities and are disabled unless explicitly requested.
  azure:
    resourceNamespace: azure-resources
    federationAudience: api://AzureADTokenExchange
    subscriptionId: ""
    tenantId: ""
    oidcIssuerUrl: ""
    location: ""
    identityResourceGroup: ""
    keyVault: {name: "", resourceGroup: ""}
    storageAccount: {name: "", resourceGroup: ""}
    blobRoleId: ""
    identities: {}
    roleAssignments: {}
    storageContainers: {}

  namespaceLabels:
    pod-security.kubernetes.io/enforce: restricted
    gitops.platform/gateway: public

  gateway:
    defaultComponent: web
    name: public
    namespace: envoy-gateway-system
    # Empty creates per-host ListenerSets; set to an existing shared HTTPS listener.
    sharedListener: ""
    clusterIssuer: letsencrypt-azuredns
    pathMatchType: PathPrefix
    listener:
      name: https
      protocol: HTTPS
      port: 443
      tlsMode: Terminate
      allowedRoutesFrom: Same
    httpRedirect:
      enabled: true
      listenerName: http
      scheme: https
      statusCode: 301

  replicas: 1
  revisionHistoryLimit: 2
  httpPortName: http

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

  pod:
    imagePullPolicy: IfNotPresent
    securityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ALL]
    volumeMounts:
      - {name: tmp, mountPath: /tmp}
      - {name: nginx-cache, mountPath: /var/cache/nginx}
    volumes:
      - {name: tmp, emptyDir: {}}
      - {name: nginx-cache, emptyDir: {}}

  probes:
    readiness:
      httpGet: {port: http}
    liveness:
      httpGet: {port: http}

  rollout:
    progressDeadlineSeconds: 180
    progressDeadlineAbort: true
    maxSurge: 1
    maxUnavailable: 0
    initialStableWeight: 100
    initialCanaryWeight: 0
    canaryWeight: 20
    analysis:
      image: python:3.12-slim@sha256:aa943ce411423c7582288f18707ff66eddcbaeb510502d747a72aeb34f30d159
      timeoutSeconds: 60
    # Optional native Rollouts override. The default steps block on candidate analysis.
    steps: []
