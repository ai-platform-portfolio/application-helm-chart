# Application values normally set only namespace, hosts and components.
namespace: ""
hosts: {}
components: {}

# Platform defaults. Applications can override replicas or resources when needed.
platform:
  gateway:
    name: public
    namespace: envoy-gateway-system
    clusterIssuer: letsencrypt-azuredns

  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

  rollout:
    maxSurge: 1
    maxUnavailable: 0
    steps:
      - setWeight: 100
