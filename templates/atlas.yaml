{{/* Used for normal ownership and the empty PostDelete desired state. */}}
{{- define "application.roleSchemaSpec" -}}
{{- $atlas := .Values.platform.atlas }}
{{- $scope := $atlas.roleScope }}
{{- $hasPasswords := false }}
{{- range $name, $role := .Values.postgres.roles }}
{{- if eq (default "password" $role.authentication) "certificate" }}
{{- if or (not $role.login) $role.passwordSecret }}
{{- fail (printf "certificate role %s requires login and must not set passwordSecret" $name) }}
{{- end }}
{{- else if $role.login }}
{{- $hasPasswords = true }}
{{- $_ := required (printf "login role %s needs passwordSecret" $name) $role.passwordSecret }}
{{- end }}
{{- end }}
{{- if and .Values.postgres.roles (not $scope) }}
{{- fail "platform.atlas.roleScope must explicitly list the roles this release owns" }}
{{- end }}

spec:
  envName: {{ $atlas.roleEnvironment | quote }}
  urlFrom:
    secretKeyRef: {name: {{ $atlas.roleConnectionSecret | quote }}, key: {{ $atlas.connectionKey | quote }}}
  cloud:
    repo: {{ required "platform.atlas.rolePlanRepository is required for role plan reviews" $atlas.rolePlanRepository | quote }}
    tokenFrom:
      secretKeyRef: {name: {{ $atlas.cloudTokenSecret | quote }}, key: {{ $atlas.cloudTokenKey | quote }}}
  policy:
    lint:
      review: {{ $atlas.roleReview }}
      destructive: {error: {{ $atlas.blockDestructiveRoles }}}
  config: |
    env {{ $atlas.roleEnvironment | toJson }} {
      include = [
        {{- range $role := $scope }}
        {{ printf "%s[type=role|user]" $role | toJson }},
        {{- end }}
      ]
      schema {
        src = "file://schema.hcl"
        mode {
          schemas     = false
          objects     = false
          roles       = true
          permissions = false
          sensitive   = ALLOW
        }
      }
    }
  schema:
    hcl: |
      {{- if not .Values.postgres.roles }}
      // Empty desired role state; keep the exact ownership include scope above.
      {{- end }}
      {{- range $name, $role := .Values.postgres.roles }}
      {{- if not (has $name $scope) }}
      {{- fail (printf "role %s is outside platform.atlas.roleScope" $name) }}
      {{- end }}
      {{- if $role.login }}
      {{- if ne (default "password" $role.authentication) "certificate" }}
      variable {{ printf "password_%s" $name | toJson }} {
        type = string
      }
      {{- end }}
      user {{ $name | toJson }} {
        {{- if ne (default "password" $role.authentication) "certificate" }}
        password = var.password_{{ $name }}
        {{- end }}
      {{- else }}
      role {{ $name | toJson }} {
      {{- end }}
        superuser   = false
        create_db   = false
        create_role = false
        {{- if $role.memberOf }}
        member_of = [
          {{- range $parent := $role.memberOf }}
          {{- if not (hasKey $.Values.postgres.roles $parent) }}
          {{- fail (printf "role %s references unmanaged membership %s" $name $parent) }}
          {{- end }}
          {{ if (index $.Values.postgres.roles $parent).login }}user{{ else }}role{{ end }}.{{ $parent }},
          {{- end }}
        ]
        {{- end }}
      }
      {{- end }}
  {{- if $hasPasswords }}
  vars:
    {{- range $name, $role := .Values.postgres.roles }}
    {{- if and $role.login (ne (default "password" $role.authentication) "certificate") }}
    - key: {{ printf "password_%s" $name }}
      valueFrom:
        secretKeyRef:
          name: {{ required (printf "login role %s needs passwordSecret" $name) $role.passwordSecret | quote }}
          key: {{ $atlas.passwordKey | quote }}
    {{- end }}
    {{- end }}
  {{- end }}
{{- end -}}

{{- include "application.defaults" . -}}
{{- $atlas := .Values.platform.atlas }}
{{- $scope := $atlas.roleScope }}
{{- if and .Values.postgres.roles (not $scope) }}
{{- fail "platform.atlas.roleScope must explicitly list the roles this release owns" }}
{{- end }}

{{- if $scope }}
apiVersion: db.atlasgo.io/v1alpha1
kind: AtlasSchema
metadata:
  name: {{ include "application.resourceName" (dict "root" . "name" "roles") }}
  namespace: {{ $atlas.namespace | quote }}
  {{- if hasKey .Values.platform.syncWaves "atlasSchema" }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.platform.syncWaves.atlasSchema | quote }}
  {{- end }}
{{ include "application.roleSchemaSpec" . }}
---
{{- end }}

{{- $histories := dict }}
{{- range $name, $migration := .Values.postgres.migrations }}
{{- $database := required (printf "migration %s references undefined database %s" $name $migration.database) (index $.Values.postgres.databases $migration.database) }}
{{- $role := required (printf "migration %s references undefined role %s" $name $migration.role) (index $.Values.postgres.roles $migration.role) }}
{{- if not $role.login }}
{{- fail (printf "migration %s requires a login role" $name) }}
{{- end }}
{{- if and $migration.schema (not $migration.revisionsSchema) }}
{{- fail (printf "migration %s needs revisionsSchema to keep history outside the application schema" $name) }}
{{- end }}
{{- if and $migration.schema (eq $migration.schema $migration.revisionsSchema) }}
{{- fail (printf "migration %s must keep revisionsSchema separate from schema" $name) }}
{{- end }}
{{- $history := printf "%s/%s" $database.name (default "atlas_schema_revisions" $migration.revisionsSchema) }}
{{- if hasKey $histories $history }}
{{- fail (printf "migration %s shares database/history %s with another migration" $name $history) }}
{{- end }}
{{- $_ := set $histories $history true }}
{{- $wave := index $.Values.platform.syncWaves "atlasMigration" }}
{{- if hasKey $migration "syncWave" }}{{- $wave = $migration.syncWave }}{{- end }}
{{- range $key, $roleName := $migration.roleVars }}
{{- if not (hasKey $.Values.postgres.roles $roleName) }}
{{- fail (printf "migration %s variable %s references unmanaged role %s" $name $key $roleName) }}
{{- end }}
{{- end }}
apiVersion: db.atlasgo.io/v1alpha1
kind: AtlasMigration
metadata:
  name: {{ include "application.resourceName" (dict "root" $ "name" $name) }}
  namespace: {{ $atlas.namespace | quote }}
  {{- if or (hasKey $migration "syncWave") (hasKey $.Values.platform.syncWaves "atlasMigration") }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ $wave | quote }}
  {{- end }}
spec:
  {{- if $migration.revisionsSchema }}
  revisionsSchema: {{ $migration.revisionsSchema | quote }}
  {{- end }}
  credentials:
    {{- $connection := deepCopy $atlas.connection }}
    {{- if $migration.schema }}
    {{- $_ := set $connection "parameters" (mergeOverwrite (dict) (default (dict) $connection.parameters) (dict "search_path" $migration.schema)) }}
    {{- end }}
    {{- if eq (default "password" $role.authentication) "certificate" }}
    {{- $_ := required "certificate migrations need platform.atlas.clientCertificate.sslcert" $atlas.clientCertificate.sslcert }}
    {{- $_ := required "certificate migrations need platform.atlas.clientCertificate.sslkey" $atlas.clientCertificate.sslkey }}
    {{- $_ := set $connection "parameters" (mergeOverwrite (default dict $connection.parameters) $atlas.clientCertificate) }}
    {{- end }}
    {{- toYaml $connection | nindent 4 }}
    database: {{ $database.name | quote }}
    user: {{ $migration.role | quote }}
    {{- if ne (default "password" $role.authentication) "certificate" }}
    passwordFrom:
      secretKeyRef:
        name: {{ $role.passwordSecret | quote }}
        key: {{ $atlas.passwordKey | quote }}
    {{- end }}
  cloud:
    tokenFrom:
      secretKeyRef: {name: {{ $atlas.cloudTokenSecret | quote }}, key: {{ $atlas.cloudTokenKey | quote }}}
  {{- if $migration.local }}
  envName: migration
  config: |
    data "template_dir" "migrations" {
      path = "migrations"
      vars = {
        {{- range $key, $roleName := $migration.roleVars }}
        {{ $key | toJson }} = {{ $roleName | toJson }}
        {{- end }}
      }
    }
    env "migration" {
      migration {
        dir = data.template_dir.migrations.url
      }
    }
  dir:
    local:
      {{- toYaml $migration.local | nindent 6 }}
  {{- else }}
  dir:
    remote:
      name: {{ $migration.repository | quote }}
      tag: {{ $migration.tag | quote }}
  {{- end }}
  {{- if $migration.devURLSecret }}
  devURLFrom:
    secretKeyRef: {name: {{ $migration.devURLSecret | quote }}, key: {{ $atlas.connectionKey | quote }}}
  {{- end }}
  protectedFlows:
    migrateDown:
      {{- if $migration.local }}
      allow: false
      {{- else }}
      {{- toYaml $atlas.migrateDown | nindent 6 }}
      {{- end }}
---
{{- end }}

{{- if or $scope .Values.postgres.migrations }}
{{- $secrets := list $atlas.cloudTokenSecret }}
{{- $states := list }}
{{- if $scope }}
{{- $secrets = append $secrets $atlas.roleConnectionSecret }}
{{- range $role := .Values.postgres.roles }}
{{- if and $role.login (ne (default "password" $role.authentication) "certificate") }}{{- $secrets = append $secrets $role.passwordSecret }}{{- end }}
{{- end }}
{{- end }}
{{- range $name, $migration := .Values.postgres.migrations }}
{{- if $migration.devURLSecret }}{{- $secrets = append $secrets $migration.devURLSecret }}{{- end }}
{{- if $migration.local }}
{{- $states = append $states (printf "io.atlasgo.db.v1.%s.latest" (include "application.resourceName" (dict "root" $ "name" $name))) }}
{{- end }}
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "application.resourceName" (dict "root" . "name" "atlas-secrets") }}
  namespace: {{ $atlas.namespace | quote }}
  {{- if hasKey .Values.platform.syncWaves "atlasAccess" }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.platform.syncWaves.atlasAccess | quote }}
  {{- end }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: {{ uniq $secrets | sortAlpha | toJson }}
    verbs: [get]
  {{- if $states }}

  - apiGroups: [""]
    resources: [secrets]
    resourceNames: {{ $states | sortAlpha | toJson }}
    verbs: [get, update]

  # Atlas creates its directory-state Secret even when downgrades are blocked.
  # Kubernetes RBAC cannot constrain top-level create by resourceNames.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  {{- end }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "application.resourceName" (dict "root" . "name" "atlas-secrets") }}
  namespace: {{ $atlas.namespace | quote }}
  {{- if hasKey .Values.platform.syncWaves "atlasAccess" }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.platform.syncWaves.atlasAccess | quote }}
  {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "application.resourceName" (dict "root" . "name" "atlas-secrets") }}
subjects:
  - kind: ServiceAccount
    name: {{ $atlas.serviceAccount | quote }}
    namespace: {{ $atlas.namespace | quote }}
{{- end }}
