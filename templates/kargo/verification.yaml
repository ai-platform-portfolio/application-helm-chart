{{- if .Values.platform.kargo.enabled -}}
{{- $id := include "application.kargoIdentity" . | fromJson -}}
{{- $namespace := .Values.platform.argocd.namespace -}}
{{- $names := list -}}
{{- range $environment := keys .Values.platform.argocd.environments.targets | sortAlpha -}}
{{- $names = append $names (printf "%s-%s" $id.base $environment) -}}
{{- end -}}
{{- $checks := list
  (dict "name" "application" "create" true)
  (dict "name" "release" "path" ".status.operationState.syncResult.revision" "value" "{{args.version}}")
  (dict "name" "operation" "path" ".status.operationState.phase" "value" "Succeeded")
  (dict "name" "sync" "path" ".status.sync.status" "value" "Synced") -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kargo-verifier
  namespace: {{ $id.base | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "-20"

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ printf "%s-verifier" $id.base | quote }}
  namespace: {{ $namespace | quote }}
rules:
  - apiGroups: [argoproj.io]
    resources: [applications]
    resourceNames: {{ $names | toJson }}
    verbs: [get, list, watch]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ printf "%s-verifier" $id.base | quote }}
  namespace: {{ $namespace | quote }}
subjects:
  - kind: ServiceAccount
    name: kargo-verifier
    namespace: {{ $id.base | quote }}
roleRef:
  kind: Role
  name: {{ printf "%s-verifier" $id.base | quote }}
  apiGroup: rbac.authorization.k8s.io

---
# Argo can be Healthy for the previous release before the Git file refreshes.
# Wait for the selected revision, its completed PostSync hook, sync and health.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: deployed-release
  namespace: {{ $id.base | quote }}
spec:
  args:
    - name: application
    - name: version
  metrics:
    - name: exact-release
      successCondition: result == "Successful"
      failureLimit: 0
      provider:
        job:
          spec:
            activeDeadlineSeconds: 900
            backoffLimit: 0
            template:
              spec:
                serviceAccountName: kargo-verifier
                restartPolicy: Never
                initContainers:
                  {{- range $check := $checks }}
                  - name: {{ printf "wait-%s" $check.name }}
                    image: {{ $.Values.platform.kargo.verification.image | quote }}
                    args:
                      - wait
                      {{- if $check.create }}
                      - {{ printf "applications.argoproj.io/%s" "{{args.application}}" | quote }}
                      {{- else }}
                      - applications.argoproj.io
                      {{- end }}
                      - {{ printf "--namespace=%s" $namespace | quote }}
                      {{- if $check.create }}
                      - --for=create
                      {{- else }}
                      - {{ printf "--field-selector=metadata.name=%s" "{{args.application}}" | quote }}
                      - {{ printf "--for=jsonpath={%s}=%s" $check.path $check.value | quote }}
                      {{- end }}
                      - --timeout=10m
                      - --cache-dir=/tmp
                    resources:
                      requests: {cpu: 10m, memory: 32Mi}
                      limits: {memory: 64Mi}
                    securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities: {drop: [ALL]}
                    volumeMounts:
                      - {name: kubectl-cache, mountPath: /tmp}
                  {{- end }}
                containers:
                  - name: verify
                    image: {{ .Values.platform.kargo.verification.image | quote }}
                    args:
                      - wait
                      - applications.argoproj.io
                      - {{ printf "--namespace=%s" $namespace | quote }}
                      - {{ printf "--field-selector=metadata.name=%s" "{{args.application}}" | quote }}
                      - "--for=jsonpath={.status.health.status}=Healthy"
                      - --timeout=10m
                      - --cache-dir=/tmp
                    resources:
                      requests: {cpu: 10m, memory: 32Mi}
                      limits: {memory: 64Mi}
                    securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities: {drop: [ALL]}
                    volumeMounts:
                      - {name: kubectl-cache, mountPath: /tmp}
                volumes:
                  - name: kubectl-cache
                    emptyDir: {}
{{- end -}}
