{{- if .Values.platform.kargo.enabled -}}
{{- $id := include "application.kargoIdentity" . | fromJson -}}
{{- $namespace := .Values.platform.argocd.namespace -}}
{{- $names := list -}}
{{- range $environment := keys .Values.platform.argocd.environments.targets | sortAlpha -}}
{{- $names = append $names (printf "%s-%s" $id.base $environment) -}}
{{- end -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kargo-verifier
  namespace: {{ $id.base | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "-20"

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ printf "%s-verifier" $id.base | quote }}
  namespace: {{ $namespace | quote }}
rules:
  - apiGroups: [argoproj.io]
    resources: [applications]
    resourceNames: {{ $names | toJson }}
    verbs: [get]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ printf "%s-verifier" $id.base | quote }}
  namespace: {{ $namespace | quote }}
subjects:
  - kind: ServiceAccount
    name: kargo-verifier
    namespace: {{ $id.base | quote }}
roleRef:
  kind: Role
  name: {{ printf "%s-verifier" $id.base | quote }}
  apiGroup: rbac.authorization.k8s.io

---
# Argo can be Healthy for the previous release before the Git file refreshes.
# Verify the selected chart version and completed PostSync browser hook together.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: deployed-release
  namespace: {{ $id.base | quote }}
spec:
  args:
    - name: application
    - name: version
  metrics:
    - name: exact-release
      successCondition: result == "Successful"
      failureLimit: 0
      provider:
        job:
          spec:
            activeDeadlineSeconds: 900
            backoffLimit: 0
            template:
              spec:
                serviceAccountName: kargo-verifier
                restartPolicy: Never
                containers:
                  - name: verify
                    image: {{ .Values.platform.kargo.verification.image | quote }}
                    command: [/bin/sh, -ec]
                    args:
                      - |
                        expected='{{ "{{args.version}}" }}'
                        application='{{ "{{args.application}}" }}'
                        attempt=0
                        while [ "$attempt" -lt 120 ]; do
                          attempt=$((attempt + 1))
                          observed="$(kubectl get application "$application" -n {{ $namespace | quote }} -o jsonpath='{.spec.source.targetRevision}{" "}{.status.sync.status}{" "}{.status.health.status}{" "}{.status.operationState.phase}' 2>/dev/null || true)"
                          if [ "$observed" = "$expected Synced Healthy Succeeded" ]; then
                            exit 0
                          fi
                          sleep 5
                        done
                        echo "Application did not complete the selected release" >&2
                        exit 1
                    resources:
                      requests: {cpu: 10m, memory: 32Mi}
                      limits: {memory: 64Mi}
                    securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities: {drop: [ALL]}
{{- end -}}
