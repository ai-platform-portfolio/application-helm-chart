{{- if or .Values.components .Values.hosts .Values.platform.azure.identities .Values.platform.azure.storageContainers .Values.postgres.databases .Values.postgres.roles .Values.postgres.migrations .Values.platform.atlas.roleScope }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ required "namespace is required" .Values.namespace | quote }}
  {{- if hasKey .Values.platform.syncWaves "namespace" }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ index .Values.platform.syncWaves "namespace" | quote }}
  {{- end }}
  labels:
    {{- toYaml .Values.platform.namespaceLabels | nindent 4 }}
{{- end }}
