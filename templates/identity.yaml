# UserAssignedIdentity
{{- range $name, $identity := .Values.platform.azure.identities }}
{{- if ne $identity.create false }}
apiVersion: managedidentity.azure.com/v1api20230131
kind: UserAssignedIdentity
metadata:
  name: {{ include "application.azureResourceName" (dict "root" $ "name" $name) }}
  namespace: {{ $.Values.platform.azure.resourceNamespace | quote }}
  {{- if hasKey $.Values.platform.syncWaves "userAssignedIdentity" }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ index $.Values.platform.syncWaves "userAssignedIdentity" | quote }}
  {{- end }}
spec:
  azureName: {{ $identity.azureName | quote }}
  location: {{ required "platform.azure.location is required" $.Values.platform.azure.location | quote }}
  owner:
    armId: {{ printf "/subscriptions/%s/resourceGroups/%s" (required "platform.azure.subscriptionId is required" $.Values.platform.azure.subscriptionId) (required "platform.azure.identityResourceGroup is required" $.Values.platform.azure.identityResourceGroup) | quote }}
  operatorSpec:
    configMaps:
      clientId:
        name: {{ include "application.azureResourceName" (dict "root" $ "name" $name) }}-client-id
        key: clientId
      principalId:
        name: {{ include "application.azureResourceName" (dict "root" $ "name" $name) }}-principal-id
        key: principalId
---
{{- end }}
{{- end }}

# FederatedIdentityCredential
{{- range $name, $identity := .Values.platform.azure.identities }}
apiVersion: managedidentity.azure.com/v1api20230131
kind: FederatedIdentityCredential
metadata:
  name: {{ include "application.azureResourceName" (dict "root" $ "name" $name) }}
  namespace: {{ $.Values.platform.azure.resourceNamespace | quote }}
  {{- if hasKey $.Values.platform.syncWaves "federatedIdentityCredential" }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ index $.Values.platform.syncWaves "federatedIdentityCredential" | quote }}
  {{- end }}
spec:
  {{- if eq $identity.create false }}
  owner:
    armId: {{ printf "/subscriptions/%s/resourceGroups/%s/providers/Microsoft.ManagedIdentity/userAssignedIdentities/%s" (required "platform.azure.subscriptionId is required" $.Values.platform.azure.subscriptionId) (required "identity.resourceGroup or platform.azure.identityResourceGroup is required" (default $.Values.platform.azure.identityResourceGroup $identity.resourceGroup)) $identity.azureName | quote }}
  {{- else }}
  owner: {name: {{ include "application.azureResourceName" (dict "root" $ "name" $name) }}}
  {{- end }}
  audiences: [{{ $.Values.platform.azure.federationAudience | quote }}]
  issuer: {{ required "platform.azure.oidcIssuerUrl is required" $.Values.platform.azure.oidcIssuerUrl | quote }}
  subject: {{ printf "system:serviceaccount:%s:%s" $.Values.namespace $name | quote }}
---
{{- end }}

# RoleAssignment
{{- range $name, $assignment := .Values.platform.azure.roleAssignments }}
{{- $identity := required (printf "role assignment %s references undefined identity %s" $name $assignment.identity) (index $.Values.platform.azure.identities $assignment.identity) }}
{{- if eq $identity.create false }}
{{- fail (printf "identity %s uses an existing managed identity; assign its roles once in platform GitOps" $assignment.identity) }}
{{- end }}
{{- $scope := include "application.azureScope" (dict "root" $ "target" $assignment.scope) }}
{{- $hash := sha256sum (printf "%s/%s/%s" $scope $identity.azureName $assignment.roleName) | trunc 32 }}
apiVersion: authorization.azure.com/v1api20220401
kind: RoleAssignment
metadata:
  name: {{ include "application.azureResourceName" (dict "root" $ "name" $name) }}
  namespace: {{ $.Values.platform.azure.resourceNamespace | quote }}
  {{- if hasKey $.Values.platform.syncWaves "roleAssignment" }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ index $.Values.platform.syncWaves "roleAssignment" | quote }}
  {{- end }}
spec:
  azureName: {{ printf "%s-%s-%s-%s-%s" (substr 0 8 $hash) (substr 8 12 $hash) (substr 12 16 $hash) (substr 16 20 $hash) (substr 20 32 $hash) | quote }}
  owner: {armId: {{ $scope | quote }}}
  principalIdFromConfig: {name: {{ include "application.azureResourceName" (dict "root" $ "name" $assignment.identity) }}-principal-id, key: principalId}
  principalType: ServicePrincipal
  roleDefinitionReference:
    wellKnownName: {{ $assignment.roleName | quote }}
---
{{- end }}
