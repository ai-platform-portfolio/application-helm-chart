{{- include "application.defaults" . -}}
# ListenerSet
{{- range $name, $host := .Values.hosts }}
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: {{ $name }}
  namespace: {{ required "namespace is required" $.Values.namespace | quote }}
  annotations:
    cert-manager.io/cluster-issuer: {{ $.Values.platform.gateway.clusterIssuer | quote }}
    {{- if hasKey $.Values.platform.syncWaves "listenerSet" }}
    argocd.argoproj.io/sync-wave: {{ index $.Values.platform.syncWaves "listenerSet" | quote }}
    {{- end }}
spec:
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ $.Values.platform.gateway.name }}
    namespace: {{ $.Values.platform.gateway.namespace }}
  listeners:
    - name: {{ $.Values.platform.gateway.listener.name }}
      hostname: {{ $host.hostname | quote }}
      protocol: {{ $.Values.platform.gateway.listener.protocol }}
      port: {{ $.Values.platform.gateway.listener.port }}
      tls:
        mode: {{ $.Values.platform.gateway.listener.tlsMode }}
        certificateRefs:
          - name: {{ $name }}-tls
      allowedRoutes:
        namespaces:
          from: {{ $.Values.platform.gateway.listener.allowedRoutesFrom }}
---
{{- end }}

# HTTPRoute
{{- range $name, $component := .Values.components }}
{{- if $component.route }}
{{- $host := required (printf "host %s is not defined" $component.route.host) (index $.Values.hosts $component.route.host) }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}
  namespace: {{ required "namespace is required" $.Values.namespace | quote }}
  {{- if hasKey $.Values.platform.syncWaves "httpRoute" }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ index $.Values.platform.syncWaves "httpRoute" | quote }}
  {{- end }}
spec:
  hostnames:
    - {{ $host.hostname | quote }}
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: {{ $component.route.host }}
      sectionName: {{ $.Values.platform.gateway.listener.name }}
  rules:
    - matches:
        - path:
            type: {{ $.Values.platform.gateway.pathMatchType }}
            value: {{ $component.route.path | quote }}
      backendRefs:
        {{- if eq $component.delivery "rollout" }}
        - name: {{ $name }}-stable
          port: {{ $component.port }}
          weight: {{ $.Values.platform.rollout.initialStableWeight }}
        - name: {{ $name }}-canary
          port: {{ $component.port }}
          weight: {{ $.Values.platform.rollout.initialCanaryWeight }}
        {{- else }}
        - name: {{ $name }}
          port: {{ $component.port }}
        {{- end }}
---
{{- end }}
{{- end }}

{{- if .Values.platform.gateway.httpRedirect.enabled }}
{{- range $name, $host := .Values.hosts }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}-redirect
  namespace: {{ required "namespace is required" $.Values.namespace | quote }}
  {{- if hasKey $.Values.platform.syncWaves "httpRoute" }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ index $.Values.platform.syncWaves "httpRoute" | quote }}
  {{- end }}
spec:
  hostnames:
    - {{ $host.hostname | quote }}
  parentRefs:
    - name: {{ $.Values.platform.gateway.name }}
      namespace: {{ $.Values.platform.gateway.namespace }}
      sectionName: {{ $.Values.platform.gateway.httpRedirect.listenerName }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: {{ $.Values.platform.gateway.httpRedirect.scheme }}
            statusCode: {{ $.Values.platform.gateway.httpRedirect.statusCode }}
---
{{- end }}
{{- end }}
