{{- include "application.defaults" . -}}
{{- $argo := .Values.platform.argocd }}
{{- if $argo.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ required "name is required for Argo registration" .Values.name | quote }}
  namespace: {{ $argo.namespace | quote }}
  {{- if .Values.platform.lifecycle.cleanup.enabled }}
  finalizers: [resources-finalizer.argocd.argoproj.io]
  {{- end }}
spec:
  project: {{ $argo.project | quote }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.namespace | quote }}
  sources:
    - repoURL: {{ $argo.chartRepository | quote }}
      targetRevision: {{ required "platform.argocd.chartRevision must pin the chart" $argo.chartRevision | quote }}
      path: .
      helm:
        releaseName: {{ .Release.Name | quote }}
        valueFiles: [{{ printf "$application/%s" $argo.valuesPath | quote }}]
        # The child renders workloads only, even if registration was enabled at bootstrap.
        valuesObject:
          platform:
            argocd: {enabled: false}
            lifecycle:
              cleanup:
                {{- toYaml .Values.platform.lifecycle.cleanup | nindent 16 }}
    - repoURL: {{ required "platform.argocd.repository is required" $argo.repository | quote }}
      targetRevision: {{ required "platform.argocd.revision must pin app values" $argo.revision | quote }}
      ref: application
  # Cleanup is opt-in. PostDelete must succeed before deletion completes.
  syncPolicy:
    retry:
      limit: 3
      backoff: {duration: 10s, factor: 2, maxDuration: 1m}
    syncOptions: [ServerSideApply=true, PruneLast=true]
{{- end }}
