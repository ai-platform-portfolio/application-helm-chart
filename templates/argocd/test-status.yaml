{{- $test := .Values.platform.tests.playwright -}}
{{- $check := .Values.platform.release.check -}}
{{- if and $test.enabled $check.enabled -}}
{{- $repository := required "deployed test status requires repository" $check.repository -}}
{{- if not (or $check.pullRequest $check.environment) -}}{{- fail "deployed test status requires pullRequest or environment" -}}{{- end -}}
{{- if and $check.pullRequest $check.environment -}}{{- fail "deployed test status cannot target both PR and environment" -}}{{- end -}}
{{- $revision := required "deployed test status requires expectedRevision" .Values.platform.release.expectedRevision -}}
{{- $token := required "deployed test status requires release check tokenSecret" $check.tokenSecret -}}
{{- range $hook := list (dict "state" "pending" "phase" "PreSync" "wave" "-1") (dict "state" "success" "phase" "PostSync" "wave" "1") (dict "state" "failure" "phase" "SyncFail" "wave" "0") -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "application.resourceName" (dict "root" $ "name" (printf "playwright-%s" $hook.state)) }}
  namespace: {{ $.Values.platform.argocd.namespace | quote }}
  annotations:
    argocd.argoproj.io/hook: {{ $hook.phase }}
    argocd.argoproj.io/sync-wave: {{ $hook.wave | quote }}
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  activeDeadlineSeconds: 60
  backoffLimit: 0
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: github-status
          image: {{ $check.image | quote }}
          command:
            - python3
            - -c
            - |
{{ $.Files.Get "files/argocd/report-test-status.py" | indent 14 }}
          env:
            - {name: REPOSITORY, value: {{ $repository | quote }}}
            - {name: PR_NUMBER, value: {{ $check.pullRequest | quote }}}
            - {name: ENVIRONMENT, value: {{ $check.environment | quote }}}
            - {name: RELEASE_VERSION, value: {{ $.Chart.Version | quote }}}
            - {name: REVISION, value: {{ $revision | quote }}}
            - {name: STATUS, value: {{ $hook.state | quote }}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 64Mi}
          volumeMounts:
            - {name: github-token, mountPath: /var/run/github, readOnly: true}
      volumes:
        - name: github-token
          secret:
            secretName: {{ $token | quote }}
            defaultMode: 0440
            items: [{key: token, path: token}]

---
{{- end -}}
{{- end -}}
