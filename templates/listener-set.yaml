{{- range $name, $resource := .Values.listenerSets }}
{{- $spec := deepCopy (required (printf "listenerSets.%s.spec is required" $name) $resource.spec) }}
{{- range $listener := $spec.listeners }}
  {{- if and (not (hasKey $listener "hostname")) $.Values.hostname }}
    {{- $_ := set $listener "hostname" $.Values.hostname }}
  {{- end }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  {{- include "application.metadata" (dict "root" $ "name" $name "resource" $resource "namespaced" true) | nindent 2 }}
spec:
  {{- toYaml $spec | nindent 2 }}
---
{{- end }}
