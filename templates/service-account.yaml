{{- include "application.defaults" . -}}
{{- range $name, $identity := .Values.platform.azure.identities }}
{{- if or $identity.clientId $identity.reflectToApplication }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ required "namespace is required" $.Values.namespace | quote }}
  annotations:
    {{- if $identity.clientId }}
    azure.workload.identity/client-id: {{ $identity.clientId | quote }}
    {{- end }}
    azure.workload.identity/tenant-id: {{ required "platform.azure.tenantId is required" $.Values.platform.azure.tenantId | quote }}
  {{- if hasKey $.Values.platform.syncWaves "serviceAccount" }}
    argocd.argoproj.io/sync-wave: {{ index $.Values.platform.syncWaves "serviceAccount" | quote }}
  {{- end }}
automountServiceAccountToken: false
---
{{- end }}
{{- end }}
