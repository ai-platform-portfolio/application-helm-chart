{{- range $name, $_ := .Values.platform.azure.identities }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ required "namespace is required" $.Values.namespace | quote }}
  {{- if hasKey $.Values.platform.syncWaves "serviceAccount" }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ index $.Values.platform.syncWaves "serviceAccount" | quote }}
  {{- end }}
automountServiceAccountToken: false
---
{{- end }}
