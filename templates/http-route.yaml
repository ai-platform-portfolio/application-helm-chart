{{- range $name, $component := .Values.components }}
{{- if $component.route }}
{{- $host := required (printf "host %s is not defined" $component.route.host) (index $.Values.hosts $component.route.host) }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}
  namespace: {{ required "namespace is required" $.Values.namespace | quote }}
spec:
  hostnames:
    - {{ $host.hostname | quote }}
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: {{ $component.route.host }}
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ $component.route.path | quote }}
      backendRefs:
        {{- if eq $component.delivery "rollout" }}
        - name: {{ $name }}-stable
          port: {{ $component.port }}
          weight: 100
        - name: {{ $name }}-canary
          port: {{ $component.port }}
          weight: 0
        {{- else }}
        - name: {{ $name }}
          port: {{ $component.port }}
        {{- end }}
---
{{- end }}
{{- end }}

{{- range $name, $host := .Values.hosts }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}-redirect
  namespace: {{ required "namespace is required" $.Values.namespace | quote }}
spec:
  hostnames:
    - {{ $host.hostname | quote }}
  parentRefs:
    - name: {{ $.Values.platform.gateway.name }}
      namespace: {{ $.Values.platform.gateway.namespace }}
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
{{- end }}
