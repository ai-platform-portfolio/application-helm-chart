{{- range $name, $config := .Values.platform.credentials.passwords }}
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
{{ include "application.credentialMetadata" (dict "root" $ "name" $name "config" $config) }}
spec:
  {{- toYaml $config.spec | nindent 2 }}
---
{{- end }}

{{- range $name, $config := .Values.platform.credentials.externalSecrets }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
{{ include "application.credentialMetadata" (dict "root" $ "name" $name "config" $config) }}
spec:
  {{- toYaml $config.spec | nindent 2 }}
---
{{- end }}

{{- range $name, $config := .Values.platform.credentials.secretStores }}
apiVersion: external-secrets.io/v1
kind: SecretStore
{{ include "application.credentialMetadata" (dict "root" $ "name" $name "config" $config) }}
spec:
  {{- toYaml $config.spec | nindent 2 }}
---
{{- end }}
