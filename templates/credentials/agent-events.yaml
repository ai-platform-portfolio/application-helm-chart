{{- include "application.defaults" . -}}
{{- if .Values.agentIntake.enabled -}}
{{- $platform := .Values.platform.agentIntake -}}
{{- $github := $platform.github -}}
{{- $name := include "application.resourceName" (dict "root" . "name" "agent-events") -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}-app
  namespace: {{ $platform.namespace }}
  annotations: {argocd.argoproj.io/sync-wave: '-10'}
spec:
  refreshInterval: 1h
  secretStoreRef: {name: {{ $platform.secretStore }}, kind: ClusterSecretStore}
  target: {name: {{ $name }}-app}
  data:
    - secretKey: private-key
      remoteRef:
        key: {{ required "platform.agentIntake.github.privateKeyRemoteKey is required" $github.privateKeyRemoteKey | quote }}
---
# ESO requires the existing App PEM; this reuses it, never creates a new key.
# The sensor can read only the short-lived dispatch token, not this private key.
apiVersion: generators.external-secrets.io/v1alpha1
kind: GithubAccessToken
metadata:
  name: {{ $name }}-dispatch
  namespace: {{ $platform.namespace }}
  annotations: {argocd.argoproj.io/sync-wave: '-5'}
spec:
  appID: {{ required "platform.agentIntake.github.appId is required" $github.appId | quote }}
  installID: {{ required "platform.agentIntake.github.installationId is required" $github.installationId | quote }}
  repositories: [{{ last (splitList "/" .Values.agentIntake.repository) | quote }}]
  permissions: {contents: write}
  auth:
    privateKey:
      secretRef: {name: {{ $name }}-app, key: private-key}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}-dispatch
  namespace: {{ $platform.namespace }}
  annotations: {argocd.argoproj.io/sync-wave: '-4'}
spec:
  refreshInterval: 15m
  target:
    name: {{ $name }}-dispatch
    template:
      engineVersion: v2
      data:
        authorization: {{ "Bearer {{ .token }}" | quote }}
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: GithubAccessToken
          name: {{ $name }}-dispatch
{{- end }}
