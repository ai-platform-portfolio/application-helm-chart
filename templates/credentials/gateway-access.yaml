{{- include "application.defaults" . -}}
{{- $gateway := .Values.platform.modelGateway -}}
{{- $consumers := dict -}}
{{- range $key, $component := .Values.components -}}
{{- if $component.gatewayAccess -}}{{- $_ := set $consumers $key $component.gatewayAccess -}}{{- end -}}
{{- end -}}
{{- range $component, $intent := $consumers -}}
{{- $policy := required "Gateway policy is not configured" (index $gateway.policies $intent.policy) -}}
{{- $name := include "application.resourceName" (dict "root" $ "name" (printf "gateway-%s" $component)) -}}
{{- $namespace := required "Gateway namespace is required" $gateway.namespace -}}
{{- $azureNamespace := $.Values.platform.azure.resourceNamespace -}}
{{- $readers := list -}}
{{- range $capability, $_ := $policy.capabilities -}}
{{- $identity := (index $.Values.components $component).identity -}}
{{- $reader := include "application.resourceName" (dict "root" $ "name" (printf "%s-gateway-%s" $identity $capability)) -}}
{{- $readers = append $readers $reader -}}
{{- end -}}
{{- $config := dict "name" $name "identity" (printf "%s/%s/%s/%s" (required "platform.modelGateway.consumerIdentity is required" $gateway.consumerIdentity) $.Values.namespace $.Release.Name $component) "endpoint" (required "platform.modelGateway.endpoint is required" $gateway.endpoint) "policy" $policy "vault" (required "platform.modelGateway.vaultUri is required" $gateway.vaultUri) "masterSecret" (required "platform.modelGateway.masterSecret is required" $gateway.masterSecret) -}}
---
# Public connection metadata; credential values never enter this ConfigMap.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
  labels:
    platform.ai-platform-portfolio/gateway-release: {{ $.Release.Name | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: '-30'
data:
  policy.json: {{ toJson $config | quote }}
---
# Native PostDelete/pre-delete hook RBAC, following the existing chart cleanup
# pattern. The platform issuer ServiceAccount/trust already exists independently.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-revoke
  namespace: {{ $azureNamespace }}
  annotations:
    argocd.argoproj.io/hook: PostDelete
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,BeforeHookCreation
    helm.sh/hook: pre-delete
    helm.sh/hook-weight: '-10'
    helm.sh/hook-delete-policy: hook-succeeded,before-hook-creation
rules:
  - apiGroups: [authorization.azure.com]
    resources: [roleassignments]
    resourceNames: {{ toJson $readers }}
    verbs: [get, delete, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-revoke
  namespace: {{ $azureNamespace }}
  annotations:
    argocd.argoproj.io/hook: PostDelete
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,BeforeHookCreation
    helm.sh/hook: pre-delete
    helm.sh/hook-weight: '-10'
    helm.sh/hook-delete-policy: hook-succeeded,before-hook-creation
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ $name }}-revoke}
subjects: [{kind: ServiceAccount, name: {{ $gateway.issuerServiceAccount }}, namespace: {{ $namespace }}}]
{{- range $operation := list "initial" "renew" "revoke" }}
---
{{- if eq $operation "renew" }}
apiVersion: batch/v1
kind: CronJob
{{- else }}
apiVersion: batch/v1
kind: Job
{{- end }}
metadata:
  {{- if eq $operation "initial" }}
  name: {{ printf "%s-%s" $name (printf "%s/%s/%s" (toJson $config) ($.Files.Get "files/gateway-access.py") $gateway.image | sha256sum | trunc 8) }}
  {{- else }}
  name: {{ printf "%s-%s" $name $operation }}
  {{- end }}
  namespace: {{ $namespace }}
  labels:
    platform.ai-platform-portfolio/gateway-consumer: 'true'
  annotations:
    {{- if eq $operation "revoke" }}
    argocd.argoproj.io/hook: PostDelete
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,BeforeHookCreation
    helm.sh/hook: pre-delete
    helm.sh/hook-delete-policy: hook-succeeded,before-hook-creation
    {{- else }}
    argocd.argoproj.io/sync-wave: '-26'
    {{- end }}
spec:
  {{- if eq $operation "renew" }}
  schedule: '0 0 * * *'
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
{{- end }}
{{- $indent := 2 -}}{{- if eq $operation "renew" -}}{{- $indent = 6 -}}{{- end }}
{{ include "application.gatewayJob" (dict "root" $ "gateway" $gateway "name" $name "operation" $operation "config" $config "readers" $readers "azureNamespace" $azureNamespace) | indent $indent }}
{{- end }}
{{- end }}

{{- define "application.gatewayJob" -}}
activeDeadlineSeconds: 300
backoffLimit: 2
template:
  spec:
    serviceAccountName: {{ .gateway.issuerServiceAccount }}
    automountServiceAccountToken: {{ eq .operation "revoke" }}
    restartPolicy: Never
    nodeSelector: {agentpool: platform}
    securityContext:
      fsGroup: 1000
      seccompProfile: {type: RuntimeDefault}
    {{- if eq .operation "revoke" }}
    initContainers:
      - name: revoke-keys
{{ include "application.gatewayManager" . | indent 8 }}
    containers:
      - name: remove-reader-grants
        image: {{ .gateway.cleanupImage | quote }}
        command: [kubectl]
        args:
          - --namespace={{ .azureNamespace }}
          - delete
          - roleassignments.authorization.azure.com
          {{- range .readers }}
          - {{ . }}
          {{- end }}
          - --ignore-not-found=true
          - --wait=true
          - --timeout=180s
        resources:
          requests: {cpu: 10m, memory: 64Mi}
          limits: {memory: 128Mi}
        securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
    {{- else }}
    containers:
      - name: credentials
{{ include "application.gatewayManager" . | indent 8 }}
    {{- end }}
    volumes:
      - name: identity
        projected:
          sources:
            - serviceAccountToken: {audience: api://AzureADTokenExchange, expirationSeconds: 3600, path: token}
      - name: redis
        secret: {secretName: litellm-redis, defaultMode: 0440}
{{- end -}}

{{- define "application.gatewayManager" -}}
image: {{ .gateway.image | quote }}
command:
  - python
  - -c
  - |
{{ .root.Files.Get "files/gateway-access.py" | indent 4 }}
args: {{ if eq .operation "revoke" }}[delete]{{ else }}[]{{ end }}
env:
  - name: GATEWAY_POLICY_JSON
    value: {{ toJson .config | quote }}
  - name: AZURE_CLIENT_ID
    valueFrom:
      secretKeyRef: {name: {{ .gateway.issuerIdentitySecret }}, key: clientId}
  - name: AZURE_TENANT_ID
    value: {{ required "platform.azure.tenantId is required" .root.Values.platform.azure.tenantId | quote }}
  - name: AZURE_FEDERATED_TOKEN_FILE
    value: /identity/token
resources:
  requests: {cpu: 25m, memory: 128Mi}
  limits: {memory: 256Mi}
securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
volumeMounts:
  - {name: identity, mountPath: /identity, readOnly: true}
  - {name: redis, mountPath: /redis, readOnly: true}
{{- end -}}
