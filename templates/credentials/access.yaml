{{- range $name, $config := .Values.platform.credentials.serviceAccounts }}
apiVersion: v1
kind: ServiceAccount
{{ include "application.credentialMetadata" (dict "root" $ "name" $name "config" $config) }}
{{ toYaml (mergeOverwrite (dict "automountServiceAccountToken" false) (omit $config "metadata")) }}
---
{{- end }}

{{- range $name, $config := .Values.platform.credentials.roles }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
{{ include "application.credentialMetadata" (dict "root" $ "name" $name "config" $config) }}
rules:
  {{- toYaml $config.rules | nindent 2 }}
---
{{- end }}

{{- range $name, $config := .Values.platform.credentials.roleBindings }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
{{ include "application.credentialMetadata" (dict "root" $ "name" $name "config" $config) }}
roleRef:
  {{- toYaml $config.roleRef | nindent 2 }}
subjects:
  {{- toYaml $config.subjects | nindent 2 }}
---
{{- end }}
