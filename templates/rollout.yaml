{{- range $name, $resource := .Values.rollouts }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  {{- include "application.metadata" (dict "root" $ "name" $name "resource" $resource "namespaced" true) | nindent 2 }}
spec:
  {{- toYaml (required (printf "rollouts.%s.spec is required" $name) $resource.spec) | nindent 2 }}
---
{{- end }}
