name: Chart

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: v3.22.1

      - name: Install Helm unit test plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest.git --version v1.2.1

      - name: Lint environment examples
        run: |
          for environment in preview staging production; do
            helm lint . -f examples/application.yaml -f "examples/${environment}.yaml"
          done

      - name: Test chart rendering
        run: helm unittest --strict .

      - name: Test cleanup ordering and failure boundaries
        run: sh tests/cleanup_test.sh
